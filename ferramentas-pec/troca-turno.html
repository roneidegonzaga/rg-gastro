<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../dose-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Troca de Turno — RG Gastrô</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #011E34; --navy2: #062d4e;
    --gold: #F7B700; --gold2: #FCC740;
    --coral: #F25C54; --cream: #FFFEE8; --cream2: #F0EECC;
    --white: #ffffff; --gray: #6b7280; --gray-l: #e5e7eb;
    --ok: #22c55e; --ok-l: #dcfce7;
    --warn: #f59e0b; --warn-l: #fef3c7;
    --nao: #ef4444; --nao-l: #fee2e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--navy); min-height: 100vh; }

  .header { background: var(--navy); padding: 20px 32px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--gold); }
  .header-center { flex: 1; }
  .header-eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
  .header-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--white); }

  .id-bar { background: var(--navy2); padding: 12px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px 20px; }
  .id-field { display: flex; flex-direction: column; gap: 3px; }
  .id-label { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .id-input { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,.2); color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 3px 0; outline: none; width: 100%; transition: border-color .2s; }
  .id-input::placeholder { color: rgba(255,255,255,.3); }
  .id-input:focus { border-bottom-color: var(--gold); }

  /* DATE BAR */
  .date-bar { background: var(--white); border-bottom: 2px solid var(--gray-l); padding: 12px 32px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .date-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }
  .date-input { border: 1.5px solid var(--gray-l); border-radius: 4px; padding: 6px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--navy); background: var(--cream); outline: none; }
  .date-sep { flex: 1; }
  .btn-hist { padding: 6px 14px; border-radius: 4px; border: 1.5px solid var(--navy2); background: transparent; color: var(--navy2); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: .5px; transition: all .15s; }
  .btn-hist:hover { background: var(--navy2); color: white; }
  .btn-novo { padding: 6px 14px; border-radius: 4px; border: none; background: var(--gold); color: var(--navy); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .5px; transition: all .15s; }
  .btn-novo:hover { background: var(--gold2); }

  /* TURNOS NAV */
  .turnos-nav { background: var(--white); border-bottom: 2px solid var(--gray-l); padding: 0 24px; display: flex; gap: 0; overflow-x: auto; }
  .turno-tab { padding: 13px 20px; font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; transition: all .15s; white-space: nowrap; }
  .turno-tab:hover { color: var(--navy); border-bottom-color: var(--gold2); }
  .turno-tab.ativo { color: var(--navy); border-bottom-color: var(--gold); font-weight: 700; }

  /* CONFIGURADOR */
  .config-bar { background: var(--cream2); padding: 10px 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .config-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray); }
  .btn-config { padding: 5px 12px; border-radius: 3px; border: 1px solid var(--gray-l); background: var(--white); font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--navy); cursor: pointer; transition: all .15s; }
  .btn-config:hover { background: var(--navy); color: white; border-color: var(--navy); }

  /* MAIN */
  .main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }

  /* PAINEL TURNO */
  .turno-panel { display: none; }
  .turno-panel.ativo { display: flex; flex-direction: column; gap: 20px; }

  /* BLOCO SAÍDA */
  .bloco { background: var(--white); border-radius: 8px; box-shadow: 0 1px 6px rgba(1,30,52,.08); overflow: hidden; }
  .bloco-header { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bloco-titulo { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--white); }
  .bloco-sub { font-size: 11px; color: rgba(255,255,255,.5); }
  .bloco-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* TABELA DE PRAÇAS */
  .praca-table { width: 100%; border-collapse: collapse; }
  .praca-table th { background: var(--cream2); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray); padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--gray-l); }
  .praca-table th.c { text-align: center; }
  .praca-row td { padding: 8px 10px; border-bottom: 1px solid var(--gray-l); vertical-align: middle; }
  .praca-row:last-child td { border-bottom: none; }
  .praca-row:hover { background: #fafaf2; }

  .td-praca { font-size: 13px; font-weight: 600; color: var(--navy); min-width: 120px; }
  .td-resp { min-width: 120px; }
  .td-qtd { width: 80px; }
  .td-rep { width: 80px; }
  .td-status { width: 90px; text-align: center; }
  .td-obs { min-width: 160px; }

  .cell-input { border: 1px solid var(--gray-l); border-radius: 4px; padding: 5px 7px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--navy); background: var(--cream); outline: none; width: 100%; transition: border-color .2s; }
  .cell-input:focus { border-color: var(--gold); }
  .cell-num { text-align: center; width: 68px; }

  .status-sel { border: 1px solid var(--gray-l); border-radius: 4px; padding: 5px 6px; font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--navy); background: var(--cream); outline: none; cursor: pointer; width: 80px; }

  .btn-rem-row { background: transparent; border: none; color: var(--gray-l); font-size: 16px; cursor: pointer; padding: 0 4px; transition: color .15s; }
  .btn-rem-row:hover { color: var(--nao); }

  .btn-add-row { width: 100%; padding: 9px; border: 1.5px dashed var(--gold); border-top: none; background: transparent; color: var(--gold); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; transition: all .2s; text-transform: uppercase; letter-spacing: 1px; border-radius: 0 0 8px 8px; }
  .btn-add-row:hover { background: var(--gold); color: var(--navy); }

  /* CAMPO DE REPASSE */
  .repasse-section { background: var(--white); border-radius: 8px; box-shadow: 0 1px 6px rgba(1,30,52,.08); overflow: hidden; }
  .repasse-header { background: var(--gold); padding: 12px 20px; }
  .repasse-titulo { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--navy); }
  .repasse-sub { font-size: 11px; color: rgba(1,30,52,.5); margin-top: 2px; }
  .repasse-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  .repasse-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .repasse-field { display: flex; flex-direction: column; gap: 6px; }
  .repasse-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray); }
  .repasse-input { border: 1px solid var(--gray-l); border-radius: 4px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--navy); background: var(--cream); outline: none; transition: border-color .2s; width: 100%; }
  .repasse-input:focus { border-color: var(--gold); }
  .repasse-obs { width: 100%; border: 1px solid var(--gray-l); border-radius: 4px; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--navy); background: var(--cream); resize: vertical; min-height: 80px; outline: none; transition: border-color .2s; }
  .repasse-obs:focus { border-color: var(--gold); }

  .assinaturas-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .assinatura-field { display: flex; flex-direction: column; gap: 6px; }
  .assinatura-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray); }
  .assinatura-linha { border: none; border-bottom: 1.5px solid var(--navy); margin-top: 28px; }
  .assinatura-nome { font-size: 11px; color: var(--gray); margin-top: 4px; text-align: center; }

  /* HISTÓRICO MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(1,30,52,.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 8px; width: 100%; max-width: 520px; max-height: 70vh; overflow: hidden; display: flex; flex-direction: column; }
  .modal-header { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: var(--white); }
  .modal-close { background: transparent; border: none; color: rgba(255,255,255,.6); font-size: 20px; cursor: pointer; }
  .modal-close:hover { color: white; }
  .modal-body { overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .hist-item { padding: 10px 14px; border-radius: 6px; background: var(--cream); border-left: 3px solid var(--gold); cursor: pointer; transition: all .15s; }
  .hist-item:hover { background: var(--cream2); }
  .hist-data { font-size: 13px; font-weight: 600; color: var(--navy); }
  .hist-resumo { font-size: 11px; color: var(--gray); }
  .hist-vazio { text-align: center; color: var(--gray); font-size: 13px; padding: 24px; }

  /* AÇÕES */
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }
  .btn-acao { padding: 10px 24px; border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border: none; transition: all .2s; }
  .btn-acao.primario { background: var(--gold); color: var(--navy); }
  .btn-acao.primario:hover { background: var(--gold2); }
  .btn-acao.secundario { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-acao.secundario:hover { background: var(--navy); color: white; }

  @media (max-width: 640px) {
    .repasse-row, .assinaturas-row { grid-template-columns: 1fr; }
    .praca-table th.hide-mobile, .praca-row .hide-mobile { display: none; }
  }
  @media print {
    .date-bar, .config-bar, .turnos-nav, .acoes, .btn-add-row, .btn-rem-row, .modal-overlay { display: none !important; }
    .turno-panel { display: flex !important; }
    body { background: white; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-center">
    <div class="header-eyebrow">RG Gastrô Educação</div>
    <div class="header-title">Registro de Troca de Turno</div>
  </div>
</div>

<div class="id-bar">
  <div class="id-field"><span class="id-label">Estabelecimento</span><input class="id-input" type="text" id="nomeEstab" placeholder="Nome do cliente" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Consultor(a)</span><input class="id-input" type="text" id="consultor" placeholder="Seu nome" onchange="salvar()"></div>
</div>

<div class="date-bar">
  <span class="date-label">Data</span>
  <input class="date-input" type="date" id="dataAtual" onchange="mudarData()">
  <div class="date-sep"></div>
  <button class="btn-hist" onclick="abrirHistorico()">📋 Histórico</button>
  <button class="btn-novo" onclick="novoRegistro()">+ Novo registro</button>
</div>

<div class="config-bar">
  <span class="config-label">Turnos</span>
  <button class="btn-config" onclick="addTurno()">+ Adicionar turno</button>
  <button class="btn-config" onclick="removerUltimoTurno()">− Remover último</button>
</div>

<div class="turnos-nav" id="turnosNav"></div>

<div class="main">
  <div id="turnosPaineis"></div>
  <div class="acoes">
    <button class="btn-acao secundario" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn-acao primario" onclick="salvar()">Salvar</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)fecharHistorico()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Histórico de Registros</span>
      <button class="modal-close" onclick="fecharHistorico()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'rgGastro_troca_turno';
const CORES_PRACAS = ["#011E34","#3B82F6","#F25C54","#22C55E","#A855F7","#F97316"];

let dadosGerais = { estab: '', consultor: '' };
let diasData = {};
let dataAtual = hoje();
let turnoAtivo = 0;

function hoje() { return new Date().toISOString().split('T')[0]; }
function formatarData(d) { const [y,m,dia] = d.split('-'); return `${dia}/${m}/${y}`; }
function horaAgora() { return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

function repassePadrao() {
  return {
    setor: '', quemSai: '', quemEntra: '', horarioTroca: '',
    observacoes: '', pendencias: '', ocorrencias: ''
  };
}

function turnoPadrao(nome, horario) {
  return {
    nome,
    horario,
    pracas: [
      { nome: 'Frituras', cor: CORES_PRACAS[0], itens: itensPradraoTurno() },
      { nome: 'Fogão', cor: CORES_PRACAS[1], itens: itensPradraoTurno() },
      { nome: 'Saladas', cor: CORES_PRACAS[2], itens: itensPradraoTurno() },
    ],
    repasses: [repassePadrao()]
  };
}

function itensPradraoTurno() {
  return [
    { produto: '', qtdEmPraca: '', qtdReposicao: '', status: '' }
  ];
}

function diaVazio() {
  return {
    turnos: [
      turnoPadrao('Abertura', '06:00 – 14:00'),
      turnoPadrao('Fechamento', '14:00 – 22:00'),
    ]
  };
}

function getDia() {
  if (!diasData[dataAtual]) diasData[dataAtual] = diaVazio();
  return diasData[dataAtual];
}

// ── RENDER ─────────────────────────────────────────────
function render() {
  document.getElementById('dataAtual').value = dataAtual;
  document.getElementById('nomeEstab').value = dadosGerais.estab || '';
  document.getElementById('consultor').value = dadosGerais.consultor || '';
  renderTabs();
  renderPaineis();
}

function renderTabs() {
  const nav = document.getElementById('turnosNav');
  nav.innerHTML = '';
  getDia().turnos.forEach((t, ti) => {
    const tab = document.createElement('div');
    tab.className = 'turno-tab' + (ti === turnoAtivo ? ' ativo' : '');
    tab.onclick = () => { turnoAtivo = ti; render(); };
    tab.textContent = t.nome;
    nav.appendChild(tab);
  });
}

function renderPaineis() {
  const container = document.getElementById('turnosPaineis');
  container.innerHTML = '';
  getDia().turnos.forEach((turno, ti) => {
    const panel = document.createElement('div');
    panel.className = 'turno-panel' + (ti === turnoAtivo ? ' ativo' : '');
    panel.id = `painel-${ti}`;
    panel.innerHTML = renderTurnoHTML(turno, ti);
    container.appendChild(panel);
  });
}

function renderTurnoHTML(turno, ti) {
  return `
  <!-- CABEÇALHO DO TURNO -->
  <div class="bloco">
    <div class="bloco-header" style="background:var(--navy2)">
      <div>
        <div class="bloco-titulo" style="display:flex;align-items:center;gap:8px">
          <input style="background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:white;font-family:'Playfair Display',serif;font-size:15px;font-weight:600;width:160px;outline:none;padding:1px 0"
            value="${turno.nome}" onchange="getDia().turnos[${ti}].nome=this.value;salvar();renderTabs()">
        </div>
        <div class="bloco-sub">Horário: <input style="background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:11px;width:120px;outline:none"
          placeholder="Ex: 06:00 – 14:00" value="${turno.horario}"
          onchange="getDia().turnos[${ti}].horario=this.value;salvar()"></div>
      </div>
    </div>
  </div>

  <!-- PRAÇAS -->
  ${turno.pracas.map((praca, pi) => `
  <div class="bloco" id="bloco-${ti}-${pi}">
    <div class="bloco-header" style="background:${praca.cor}">
      <div>
        <div class="bloco-titulo">
          <input style="background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:white;font-family:'Playfair Display',serif;font-size:15px;font-weight:600;width:180px;outline:none"
            value="${praca.nome}" onchange="getDia().turnos[${ti}].pracas[${pi}].nome=this.value;salvar()">
        </div>
      </div>
      <button onclick="removePraca(${ti},${pi})" style="background:rgba(255,255,255,.15);border:none;color:white;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:10px">✕</button>
    </div>
    <table class="praca-table">
      <thead><tr>
        <th style="width:180px">Item / Produto</th>
        <th class="c" style="width:90px">Qtd em Praça</th>
        <th class="c" style="width:90px">Qtd Reposição</th>
        <th class="c hide-mobile" style="width:80px">Status</th>
        <th style="min-width:140px" class="hide-mobile">Observação do item</th>
        <th style="width:30px"></th>
      </tr></thead>
      <tbody>
        ${praca.itens.map((item, ii) => `
        <tr class="praca-row">
          <td><input class="cell-input" type="text" placeholder="Nome do item..." value="${item.produto||''}"
            onchange="getDia().turnos[${ti}].pracas[${pi}].itens[${ii}].produto=this.value;salvar()"></td>
          <td class="td-qtd"><input class="cell-input cell-num" type="text" placeholder="—" value="${item.qtdEmPraca||''}"
            onchange="getDia().turnos[${ti}].pracas[${pi}].itens[${ii}].qtdEmPraca=this.value;salvar()"></td>
          <td class="td-rep"><input class="cell-input cell-num" type="text" placeholder="—" value="${item.qtdReposicao||''}"
            onchange="getDia().turnos[${ti}].pracas[${pi}].itens[${ii}].qtdReposicao=this.value;salvar()"></td>
          <td class="td-status hide-mobile">
            <select class="status-sel" onchange="getDia().turnos[${ti}].pracas[${pi}].itens[${ii}].status=this.value;salvar()">
              <option value="" ${!item.status?'selected':''}>—</option>
              <option value="ok" ${item.status==='ok'?'selected':''}>✓ OK</option>
              <option value="repor" ${item.status==='repor'?'selected':''}>⚠ Repor</option>
              <option value="falta" ${item.status==='falta'?'selected':''}>✕ Falta</option>
            </select>
          </td>
          <td class="hide-mobile"><input class="cell-input" type="text" placeholder="Observação..." value="${item.obs||''}"
            onchange="getDia().turnos[${ti}].pracas[${pi}].itens[${ii}].obs=this.value;salvar()"></td>
          <td><button class="btn-rem-row" onclick="removeItemTurno(${ti},${pi},${ii})">×</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <button class="btn-add-row" onclick="addItemTurno(${ti},${pi})">+ Adicionar item</button>
  </div>`).join('')}

  <!-- BOTÃO ADICIONAR PRAÇA -->
  <button class="btn-add-praca" style="width:100%;padding:12px;border:2px dashed var(--navy2);border-radius:8px;background:transparent;color:var(--navy2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s"
    onmouseover="this.style.background='var(--navy)';this.style.color='white'"
    onmouseout="this.style.background='transparent';this.style.color='var(--navy2)'"
    onclick="addPracaTurno(${ti})">+ Adicionar praça neste turno</button>

  <!-- REPASSE -->
  ${(turno.repasses || [turno.repasse]).map((repasse, ri) => `
  <div class="repasse-section" style="margin-bottom:14px">
    <div class="repasse-header" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div class="repasse-titulo">Repasse de Turno${(turno.repasses||[]).length>1?` — Repasse ${ri+1}`:''}</div>
        <div class="repasse-sub">Informações que o próximo turno precisa saber</div>
      </div>
      ${(turno.repasses||[]).length>1?`<button class="btn-rem-row" style="font-size:18px" onclick="removeRepasseTurno(${ti},${ri})" title="Remover este repasse">×</button>`:''}
    </div>
    <div class="repasse-body">
      <div class="repasse-field">
        <span class="repasse-label">Setor / área deste repasse</span>
        <input class="repasse-input" type="text" placeholder="Ex: Cozinha, Salão, Bar, Caixa..."
          value="${repasse.setor||''}"
          onchange="getDia().turnos[${ti}].repasses[${ri}].setor=this.value;salvar()">
      </div>
      <div class="repasse-row">
        <div class="repasse-field">
          <span class="repasse-label">Quem está saindo</span>
          <input class="repasse-input" type="text" placeholder="Nome e função"
            value="${repasse.quemSai||''}"
            onchange="getDia().turnos[${ti}].repasses[${ri}].quemSai=this.value;salvar()">
        </div>
        <div class="repasse-field">
          <span class="repasse-label">Quem está entrando</span>
          <input class="repasse-input" type="text" placeholder="Nome e função"
            value="${repasse.quemEntra||''}"
            onchange="getDia().turnos[${ti}].repasses[${ri}].quemEntra=this.value;salvar()">
        </div>
      </div>
      <div class="repasse-row">
        <div class="repasse-field">
          <span class="repasse-label">Horário da troca</span>
          <input class="repasse-input" type="text" placeholder="Ex: 14:05"
            value="${repasse.horarioTroca||''}"
            onchange="getDia().turnos[${ti}].repasses[${ri}].horarioTroca=this.value;salvar()">
        </div>
        <div class="repasse-field"></div>
      </div>
      <div class="repasse-field">
        <span class="repasse-label">Pendências deixadas para o próximo turno</span>
        <textarea class="repasse-obs" placeholder="O que ficou pendente e precisa ser resolvido no próximo turno..."
          onchange="getDia().turnos[${ti}].repasses[${ri}].pendencias=this.value;salvar()">${repasse.pendencias||''}</textarea>
      </div>
      <div class="repasse-field">
        <span class="repasse-label">Ocorrências e observações do turno</span>
        <textarea class="repasse-obs" placeholder="Problemas, acidentes, ajustes feitos, equipamentos com problema, comportamentos da equipe, reclamações de cliente..."
          onchange="getDia().turnos[${ti}].repasses[${ri}].ocorrencias=this.value;salvar()">${repasse.ocorrencias||''}</textarea>
      </div>
      <div class="repasse-field">
        <span class="repasse-label">Comunicado para a gestão</span>
        <textarea class="repasse-obs" style="min-height:56px" placeholder="O que o dono ou gestor precisa saber..."
          onchange="getDia().turnos[${ti}].repasses[${ri}].observacoes=this.value;salvar()">${repasse.observacoes||''}</textarea>
      </div>
      <div class="assinaturas-row">
        <div class="assinatura-field">
          <span class="assinatura-label">Assinatura — quem saiu</span>
          <div class="assinatura-linha"></div>
          <div class="assinatura-nome">${repasse.quemSai || 'Nome'}</div>
        </div>
        <div class="assinatura-field">
          <span class="assinatura-label">Assinatura — quem entrou</span>
          <div class="assinatura-linha"></div>
          <div class="assinatura-nome">${repasse.quemEntra || 'Nome'}</div>
        </div>
      </div>
    </div>
  </div>`).join('')}
  <button class="btn-add-praca" style="width:100%;padding:12px;border:2px dashed var(--navy2);border-radius:8px;background:transparent;color:var(--navy2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s" onclick="addRepasseTurno(${ti})">+ Adicionar repasse de outro setor / pessoa</button>`;
}

// ── AÇÕES ──────────────────────────────────────────────
function addRepasseTurno(ti) {
  const turno = getDia().turnos[ti];
  if (!turno.repasses) turno.repasses = [repassePadrao()];
  turno.repasses.push(repassePadrao());
  salvar(); renderPaineis();
}

function removeRepasseTurno(ti, ri) {
  const turno = getDia().turnos[ti];
  if (turno.repasses.length <= 1) return;
  if (!confirm('Remover este repasse?')) return;
  turno.repasses.splice(ri, 1);
  salvar(); renderPaineis();
}

function addItemTurno(ti, pi) {
  getDia().turnos[ti].pracas[pi].itens.push({ produto: '', qtdEmPraca: '', qtdReposicao: '', status: '', obs: '' });
  salvar(); renderPaineis();
}

function removeItemTurno(ti, pi, ii) {
  const itens = getDia().turnos[ti].pracas[pi].itens;
  if (itens.length <= 1) return;
  itens.splice(ii, 1);
  salvar(); renderPaineis();
}

function addPracaTurno(ti) {
  const nome = prompt('Nome da praça:');
  if (!nome) return;
  const pi = getDia().turnos[ti].pracas.length;
  getDia().turnos[ti].pracas.push({ nome, cor: CORES_PRACAS[pi % CORES_PRACAS.length], itens: itensPradraoTurno() });
  salvar(); renderPaineis();
}

function removePraca(ti, pi) {
  if (!confirm(`Remover a praça "${getDia().turnos[ti].pracas[pi].nome}"?`)) return;
  getDia().turnos[ti].pracas.splice(pi, 1);
  salvar(); renderPaineis();
}

function addTurno() {
  const nome = prompt('Nome do turno:') || `Turno ${getDia().turnos.length + 1}`;
  const horario = prompt('Horário (ex: 22:00 – 06:00):') || '';
  getDia().turnos.push(turnoPadrao(nome, horario));
  turnoAtivo = getDia().turnos.length - 1;
  salvar(); render();
}

function removerUltimoTurno() {
  const turnos = getDia().turnos;
  if (turnos.length <= 1) return;
  if (!confirm(`Remover o turno "${turnos[turnos.length-1].nome}"?`)) return;
  turnos.pop();
  if (turnoAtivo >= turnos.length) turnoAtivo = turnos.length - 1;
  salvar(); render();
}

function mudarData() {
  dataAtual = document.getElementById('dataAtual').value;
  turnoAtivo = 0;
  render();
}

function novoRegistro() {
  const novaData = hoje();
  if (diasData[novaData] && !confirm('Já existe um registro para hoje. Substituir?')) return;
  const ultimo = Object.keys(diasData).sort().pop();
  if (ultimo && diasData[ultimo]) {
    diasData[novaData] = JSON.parse(JSON.stringify(diasData[ultimo]));
    diasData[novaData].turnos.forEach(t => {
      t.pracas.forEach(p => { p.itens.forEach(i => { i.qtdEmPraca=''; i.qtdReposicao=''; i.status=''; i.obs=''; }); });
      t.repasses = [repassePadrao()];
      delete t.repasse;
    });
  } else {
    diasData[novaData] = diaVazio();
  }
  dataAtual = novaData;
  turnoAtivo = 0;
  salvar(); render();
}

// ── HISTÓRICO ─────────────────────────────────────────
function abrirHistorico() {
  const body = document.getElementById('modalBody');
  const datas = Object.keys(diasData).sort().reverse();
  if (datas.length === 0) {
    body.innerHTML = '<div class="hist-vazio">Nenhum histórico salvo ainda.</div>';
  } else {
    body.innerHTML = datas.map(d => {
      const dia = diasData[d];
      const nTurnos = dia.turnos.length;
      return `<div class="hist-item" onclick="carregarDia('${d}')">
        <div class="hist-data">${formatarData(d)}${d===hoje()?' <span style="font-size:10px;background:var(--gold);color:var(--navy);border-radius:3px;padding:1px 5px;font-weight:700">HOJE</span>':''}</div>
        <div class="hist-resumo">${nTurnos} turno${nTurnos!==1?'s':''} registrado${nTurnos!==1?'s':''}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function carregarDia(d) { dataAtual = d; turnoAtivo = 0; fecharHistorico(); render(); }
function fecharHistorico() { document.getElementById('modalOverlay').classList.remove('open'); }

// ── PERSISTÊNCIA ──────────────────────────────────────
function salvar() {
  dadosGerais.estab = document.getElementById('nomeEstab').value;
  dadosGerais.consultor = document.getElementById('consultor').value;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ dadosGerais, diasData })); } catch(e) {}
}

function carregar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s.dadosGerais) dadosGerais = s.dadosGerais; if (s.diasData) diasData = s.diasData; }
  } catch(e) {}
  // Migração: registros antigos tinham um único "repasse" por turno; agora é uma lista "repasses"
  Object.values(diasData).forEach(dia => {
    (dia.turnos || []).forEach(t => {
      if (!t.repasses) {
        t.repasses = t.repasse ? [t.repasse] : [repassePadrao()];
      }
      delete t.repasse;
    });
  });
}

// ── INIT ──────────────────────────────────────────────
carregar();
if (!diasData[dataAtual]) diasData[dataAtual] = diaVazio();
render();
</script>
</body>
</html>
