<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../dose-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Controle de Desperdício — RG Gastrô</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#011E34;--navy2:#062d4e;--gold:#F7B700;--gold2:#FCC740;--coral:#F25C54;--cream:#FFFEE8;--cream2:#F0EECC;--white:#ffffff;--gray:#6b7280;--gray-l:#e5e7eb;--ok:#22c55e;--ok-l:#dcfce7;--warn:#f59e0b;--warn-l:#fef3c7;--nao:#ef4444;--nao-l:#fee2e2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--navy);min-height:100vh;}
  .header{background:var(--navy);padding:20px 32px 16px;border-bottom:3px solid var(--gold);}
  .header-eyebrow{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
  .header-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--white);}
  .id-bar{background:var(--navy2);padding:12px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 20px;}
  .id-field{display:flex;flex-direction:column;gap:3px;}
  .id-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
  .id-input{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;padding:3px 0;outline:none;width:100%;}
  .id-input::placeholder{color:rgba(255,255,255,.3);}
  .id-input:focus{border-bottom-color:var(--gold);}
  .main{max-width:1200px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px;}
  .resumo{background:var(--navy);border-radius:8px;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
  .resumo-card{background:rgba(255,255,255,.06);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px;}
  .resumo-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1;color:var(--gold);}
  .resumo-card.alerta .resumo-num{color:#fbbf24;}
  .resumo-card.critico .resumo-num{color:#f87171;}
  .resumo-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.5);}
  .section{background:var(--white);border-radius:8px;box-shadow:0 1px 6px rgba(1,30,52,.08);overflow:hidden;}
  .sec-header{background:var(--navy);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .sec-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--white);}
  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--cream2);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);padding:8px 10px;text-align:left;border-bottom:1px solid var(--gray-l);}
  thead th.c{text-align:center;}
  tbody tr:hover{background:#fafaf2;}
  td{padding:7px 10px;border-bottom:1px solid var(--gray-l);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .td-num{font-family:'Playfair Display',serif;font-size:12px;font-weight:600;color:var(--gold);text-align:center;width:40px;}
  .cell-in{border:1px solid var(--gray-l);border-radius:3px;padding:4px 6px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--navy);background:var(--cream);outline:none;width:100%;}
  .cell-in:focus{border-color:var(--gold);}
  .cell-sel{border:1px solid var(--gray-l);border-radius:3px;padding:4px 5px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--navy);background:var(--cream);outline:none;cursor:pointer;width:100%;}
  .cell-num{text-align:center;width:80px;}
  .custo-total{font-weight:700;color:var(--nao);text-align:center;}
  .btn-rem{background:transparent;border:none;color:var(--gray-l);font-size:15px;cursor:pointer;padding:0 3px;transition:color .15s;}
  .btn-rem:hover{color:var(--nao);}
  .btn-add{width:100%;padding:10px;border:1.5px dashed var(--gold);border-top:none;background:transparent;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;border-radius:0 0 8px 8px;}
  .btn-add:hover{background:var(--gold);color:var(--navy);}
  .motivos-grid{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .motivo-card{background:var(--cream);border-radius:6px;padding:12px 14px;border-left:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .motivo-nome{font-size:12px;font-weight:600;color:var(--navy);}
  .motivo-count{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--nao);}
  .total-bar{background:var(--nao);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .total-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .total-valor{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .btn-acao{padding:10px 24px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .2s;}
  .btn-acao.primario{background:var(--gold);color:var(--navy);}
  .btn-acao.primario:hover{background:var(--gold2);}
  .btn-acao.secundario{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-acao.secundario:hover{background:var(--navy);color:white;}
  @media print{.acoes,.btn-add,.btn-rem{display:none;}body{background:white;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-eyebrow">RG Gastrô Educação</div>
  <div class="header-title">Controle de Desperdício</div>
</div>
<div class="id-bar">
  <div class="id-field"><span class="id-label">Estabelecimento</span><input class="id-input" type="text" id="estab" placeholder="Nome do cliente" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Semana</span><input class="id-input" type="text" id="semana" placeholder="Ex: 02/06 a 08/06" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Responsável</span><input class="id-input" type="text" id="resp" placeholder="Nome" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Consultor(a)</span><input class="id-input" type="text" id="consultor" placeholder="Seu nome" onchange="salvar()"></div>
</div>
<div class="main">
  <div class="resumo" id="resumo"></div>
  <div class="section">
    <div class="sec-header"><span class="sec-title">Registros de Desperdício</span></div>
    <table>
      <thead><tr>
        <th style="width:40px" class="c">#</th>
        <th style="width:100px">Data</th>
        <th>Produto / Insumo</th>
        <th style="width:120px">Categoria</th>
        <th style="width:70px" class="c">Unid.</th>
        <th style="width:90px" class="c">Qtd Desperdiçada</th>
        <th style="width:110px" class="c">Custo Unit. (R$)</th>
        <th style="width:110px" class="c">Custo Total (R$)</th>
        <th style="width:160px">Motivo</th>
        <th style="width:30px"></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="btn-add" onclick="addItem()">+ Adicionar registro</button>
  </div>
  <div class="section">
    <div class="sec-header"><span class="sec-title">Análise por Motivo</span></div>
    <div class="motivos-grid" id="motivosGrid"></div>
  </div>
  <div class="total-bar">
    <span class="total-label">Total de Desperdício no Período</span>
    <span class="total-valor" id="totalValor">R$ 0,00</span>
  </div>
  <div class="acoes">
    <button class="btn-acao secundario" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn-acao primario" onclick="salvar()">Salvar</button>
  </div>
</div>
<script>
const KEY='rgGastro_desperdicio';
const CATS=['Proteínas','Hortifrúti','Secos','Frios e Laticínios','Descartáveis','Outros'];
const MOTIVOS=['Superprodução','Validade vencida','Erro de preparo','Sobra de porção','Quebra / acidente','Armazenamento incorreto','Outro'];
let itens=[];
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);itens=d.itens||[];document.getElementById('estab').value=d.estab||'';document.getElementById('semana').value=d.semana||'';document.getElementById('resp').value=d.resp||'';document.getElementById('consultor').value=d.consultor||'';}}catch(e){}
if(itens.length===0)addItem();

function fmt(n){return isNaN(n)||n===''?'—':'R$ '+parseFloat(n).toFixed(2).replace('.',',');}

function maskData(el){
  let v=el.value.replace(/\D/g,'').slice(0,8);
  if(v.length>=5)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);
  el.value=v;
}

function addItem(){itens.push({data:'',produto:'',categoria:CATS[0],unidade:'kg',qtd:'',custo:'',motivo:MOTIVOS[0]});render();}
function removeItem(i){itens.splice(i,1);render();}

function render(){
  const tbody=document.getElementById('tbody');tbody.innerHTML='';
  let total=0; const contagemMotivos={};MOTIVOS.forEach(m=>contagemMotivos[m]=0);
  itens.forEach((item,i)=>{
    const ct=item.qtd&&item.custo?parseFloat(item.qtd)*parseFloat(item.custo):0;
    if(ct)total+=ct;
    if(item.motivo)contagemMotivos[item.motivo]=(contagemMotivos[item.motivo]||0)+1;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="td-num">${String(i+1).padStart(2,'0')}</td>
      <td><input class="cell-in" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" value="${item.data}" oninput="maskData(this)" onchange="itens[${i}].data=this.value;salvar()"></td>
      <td><input class="cell-in" type="text" placeholder="Nome do produto..." value="${item.produto}" onchange="itens[${i}].produto=this.value;salvar()"></td>
      <td><select class="cell-sel" onchange="itens[${i}].categoria=this.value;salvar()">${CATS.map(c=>`<option${c===item.categoria?' selected':''}>${c}</option>`).join('')}</select></td>
      <td><select class="cell-sel" onchange="itens[${i}].unidade=this.value;salvar()" style="width:60px"><option${item.unidade==='kg'?' selected':''}>kg</option><option${item.unidade==='g'?' selected':''}>g</option><option${item.unidade==='L'?' selected':''}>L</option><option${item.unidade==='un'?' selected':''}>un</option><option${item.unidade==='cx'?' selected':''}>cx</option></select></td>
      <td><input class="cell-in cell-num" type="number" min="0" step="0.01" value="${item.qtd}" placeholder="0" onchange="itens[${i}].qtd=this.value;salvar();render()"></td>
      <td><input class="cell-in cell-num" type="number" min="0" step="0.01" value="${item.custo}" placeholder="0,00" onchange="itens[${i}].custo=this.value;salvar();render()"></td>
      <td class="custo-total">${ct?fmt(ct):'—'}</td>
      <td><select class="cell-sel" onchange="itens[${i}].motivo=this.value;salvar();render()">${MOTIVOS.map(m=>`<option${m===item.motivo?' selected':''}>${m}</option>`).join('')}</select></td>
      <td><button class="btn-rem" onclick="removeItem(${i})">×</button></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('totalValor').textContent=fmt(total);
  // Resumo
  document.getElementById('resumo').innerHTML=`
    <div class="resumo-card"><span class="resumo-num">${itens.filter(i=>i.produto).length}</span><span class="resumo-label">Registros</span></div>
    <div class="resumo-card critico"><span class="resumo-num">${fmt(total)}</span><span class="resumo-label">Custo total</span></div>
    <div class="resumo-card alerta"><span class="resumo-num">${MOTIVOS.reduce((a,m)=>Math.max(a,contagemMotivos[m]||0),0)}</span><span class="resumo-label">Maior recorrência</span></div>
    <div class="resumo-card"><span class="resumo-num">${itens.filter(i=>i.produto&&!i.custo).length}</span><span class="resumo-label">Sem custo preenchido</span></div>`;
  // Motivos
  const grid=document.getElementById('motivosGrid');grid.innerHTML='';
  MOTIVOS.forEach(m=>{
    if(!contagemMotivos[m])return;
    const card=document.createElement('div');card.className='motivo-card';
    card.innerHTML=`<span class="motivo-nome">${m}</span><span class="motivo-count">${contagemMotivos[m]}x</span>`;
    grid.appendChild(card);
  });
  if(!grid.innerHTML)grid.innerHTML='<span style="color:var(--gray);font-size:12px;padding:4px">Preencha os registros para ver a análise por motivo.</span>';
}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify({estab:document.getElementById('estab').value,semana:document.getElementById('semana').value,resp:document.getElementById('resp').value,consultor:document.getElementById('consultor').value,itens}));}catch(e){}}
render();
</script>
</body>
</html>
