<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../dose-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inventário de Insumos — RG Gastrô</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#011E34;--navy2:#062d4e;--gold:#F7B700;--gold2:#FCC740;
    --coral:#F25C54;--cream:#FFFEE8;--cream2:#F0EECC;
    --white:#ffffff;--gray:#6b7280;--gray-l:#e5e7eb;
    --ok:#22c55e;--ok-l:#dcfce7;--warn:#f59e0b;--warn-l:#fef3c7;--nao:#ef4444;--nao-l:#fee2e2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--navy);min-height:100vh;}
  .header{background:var(--navy);padding:20px 32px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--gold);}
  .header-center{flex:1;}
  .header-eyebrow{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
  .header-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--white);}
  .id-bar{background:var(--navy2);padding:12px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 20px;}
  .id-field{display:flex;flex-direction:column;gap:3px;}
  .id-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
  .id-input{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;padding:3px 0;outline:none;width:100%;}
  .id-input::placeholder{color:rgba(255,255,255,.3);}
  .id-input:focus{border-bottom-color:var(--gold);}
  .main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px;}

  /* CATEGORIAS TABS */
  .cats-nav{background:var(--white);border-radius:8px;box-shadow:0 1px 6px rgba(1,30,52,.08);padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .cat-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:1.5px solid var(--gray-l);background:transparent;color:var(--gray);transition:all .15s;}
  .cat-chip:hover{border-color:var(--navy);color:var(--navy);}
  .cat-chip.ativo{background:var(--navy);border-color:var(--navy);color:white;}
  .btn-add-cat{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px dashed var(--gold);background:transparent;color:var(--gold);cursor:pointer;transition:all .2s;}
  .btn-add-cat:hover{background:var(--gold);color:var(--navy);}

  /* TABELA */
  .table-section{background:var(--white);border-radius:8px;box-shadow:0 1px 6px rgba(1,30,52,.08);overflow:hidden;}
  .table-header{background:var(--navy);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .table-titulo{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--white);}
  .table-actions{display:flex;gap:8px;align-items:center;}
  .btn-filtro{padding:5px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;}
  .btn-filtro:hover,.btn-filtro.ativo{background:rgba(255,255,255,.15);color:white;}

  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--cream2);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);padding:8px 10px;text-align:left;border-bottom:1px solid var(--gray-l);}
  thead th.c{text-align:center;}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:#fafaf2;}
  tbody tr:last-child td{border-bottom:none;}
  td{padding:7px 10px;border-bottom:1px solid var(--gray-l);vertical-align:middle;}

  .td-num{font-family:'Playfair Display',serif;font-size:12px;font-weight:600;color:var(--gold);text-align:center;width:40px;}
  .cell-in{border:1px solid var(--gray-l);border-radius:3px;padding:4px 6px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--navy);background:var(--cream);outline:none;transition:border-color .2s;width:100%;}
  .cell-in:focus{border-color:var(--gold);}
  .cell-num{text-align:center;width:70px;}
  .cell-sel{border:1px solid var(--gray-l);border-radius:3px;padding:4px 5px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--navy);background:var(--cream);outline:none;cursor:pointer;width:100%;}

  .status-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .status-ok{background:var(--ok-l);color:var(--ok);}
  .status-baixo{background:var(--warn-l);color:var(--warn);}
  .status-critico{background:var(--nao-l);color:var(--nao);}
  .status-nd{background:var(--gray-l);color:var(--gray);}

  .btn-rem{background:transparent;border:none;color:var(--gray-l);font-size:15px;cursor:pointer;padding:0 3px;transition:color .15s;}
  .btn-rem:hover{color:var(--nao);}

  .btn-add-item{width:100%;padding:10px;border:1.5px dashed var(--gold);border-top:none;background:transparent;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;border-radius:0 0 8px 8px;}
  .btn-add-item:hover{background:var(--gold);color:var(--navy);}

  /* RESUMO */
  .resumo{background:var(--navy);border-radius:8px;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;}
  .resumo-card{background:rgba(255,255,255,.06);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px;}
  .resumo-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1;}
  .resumo-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.5);}
  .resumo-card.ok .resumo-num{color:#4ade80;}
  .resumo-card.baixo .resumo-num{color:#fbbf24;}
  .resumo-card.critico .resumo-num{color:#f87171;}
  .resumo-card.total .resumo-num{color:var(--gold);}

  .acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .btn-acao{padding:10px 24px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .2s;}
  .btn-acao.primario{background:var(--gold);color:var(--navy);}
  .btn-acao.primario:hover{background:var(--gold2);}
  .btn-acao.secundario{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-acao.secundario:hover{background:var(--navy);color:white;}

  @media print{.cats-nav,.table-actions,.btn-add-item,.acoes,.btn-rem{display:none;}body{background:white;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-center">
    <div class="header-eyebrow">RG Gastrô Educação</div>
    <div class="header-title">Inventário de Insumos</div>
  </div>
</div>
<div class="id-bar">
  <div class="id-field"><span class="id-label">Estabelecimento</span><input class="id-input" type="text" id="estab" placeholder="Nome do cliente" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Data</span><input class="id-input" type="date" id="data" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Responsável</span><input class="id-input" type="text" id="resp" placeholder="Nome" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Consultor(a)</span><input class="id-input" type="text" id="consultor" placeholder="Seu nome" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Período</span><input class="id-input" type="text" id="periodo" placeholder="Ex: Quinzenal" onchange="salvar()"></div>
</div>
<div class="main">

  <div class="cats-nav" id="catsNav"></div>

  <div class="resumo" id="resumo"></div>

  <div class="table-section">
    <div class="table-header">
      <span class="table-titulo" id="tableTitle">Todos os insumos</span>
      <div class="table-actions">
        <button class="btn-filtro" id="fTodos" onclick="setFiltro('todos')" >Todos</button>
        <button class="btn-filtro" id="fBaixo" onclick="setFiltro('baixo')">Baixo</button>
        <button class="btn-filtro" id="fCritico" onclick="setFiltro('critico')">Crítico</button>
      </div>
    </div>
    <table>
      <thead><tr>
        <th style="width:40px" class="c">#</th>
        <th>Insumo</th>
        <th style="width:110px">Categoria</th>
        <th class="c" style="width:80px">Unidade</th>
        <th class="c" style="width:80px">Estoque Mínimo</th>
        <th class="c" style="width:80px">Qtd em Estoque</th>
        <th class="c" style="width:90px">Status</th>
        <th style="width:120px">Observação</th>
        <th style="width:30px"></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="btn-add-item" onclick="addItem()">+ Adicionar insumo</button>
  </div>

  <div class="acoes">
    <button class="btn-acao secundario" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn-acao primario" onclick="salvar()">Salvar</button>
  </div>
</div>

<script>
const KEY='rgGastro_inventario_insumos';
let dados={estab:'',data:'',resp:'',consultor:'',periodo:'',categorias:['Proteínas','Hortifrúti','Secos','Frios e Laticínios','Bebidas','Descartáveis'],itens:[]};
let catAtiva='Todas';let filtro='todos';

function hoje(){return new Date().toISOString().split('T')[0];}

function itemPadrao(){return{produto:'',categoria:dados.categorias[0]||'',unidade:'kg',minimo:'',qtd:'',obs:''};}

function getStatus(item){
  if(!item.qtd||!item.minimo)return'nd';
  const q=parseFloat(item.qtd),m=parseFloat(item.minimo);
  if(isNaN(q)||isNaN(m))return'nd';
  if(q<=0)return'critico';
  if(q<m)return'baixo';
  return'ok';
}

function render(){
  document.getElementById('estab').value=dados.estab||'';
  document.getElementById('data').value=dados.data||'';
  document.getElementById('resp').value=dados.resp||'';
  document.getElementById('consultor').value=dados.consultor||'';
  document.getElementById('periodo').value=dados.periodo||'';

  renderCats();
  renderTabela();
  renderResumo();
}

function renderCats(){
  const nav=document.getElementById('catsNav');
  nav.innerHTML='';
  const todas=document.createElement('button');
  todas.className='cat-chip'+(catAtiva==='Todas'?' ativo':'');
  todas.textContent='Todas';
  todas.onclick=()=>{catAtiva='Todas';render();};
  nav.appendChild(todas);
  dados.categorias.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='cat-chip'+(catAtiva===c?' ativo':'');
    btn.style.display='inline-flex';
    btn.style.alignItems='center';
    btn.style.gap='6px';
    btn.innerHTML=`<span>${c}</span><span style="opacity:.6;font-weight:700" title="Remover categoria">×</span>`;
    btn.querySelector('span:first-child').onclick=()=>{catAtiva=c;render();};
    btn.querySelector('span:last-child').onclick=(e)=>{e.stopPropagation();removeCategoria(c);};
    nav.appendChild(btn);
  });
  const addBtn=document.createElement('button');
  addBtn.className='btn-add-cat';
  addBtn.textContent='+ Categoria';
  addBtn.onclick=addCategoria;
  nav.appendChild(addBtn);
}

function renderTabela(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  let itens=dados.itens;
  if(catAtiva!=='Todas')itens=itens.filter(i=>i.categoria===catAtiva);
  if(filtro==='baixo')itens=itens.filter(i=>getStatus(i)==='baixo');
  if(filtro==='critico')itens=itens.filter(i=>getStatus(i)==='critico');
  document.getElementById('tableTitle').textContent=catAtiva==='Todas'?'Todos os insumos':catAtiva;
  itens.forEach((item,vi)=>{
    const ri=dados.itens.indexOf(item);
    const st=getStatus(item);
    const stMap={ok:'<span class="status-badge status-ok">OK</span>',baixo:'<span class="status-badge status-baixo">Baixo</span>',critico:'<span class="status-badge status-critico">Crítico</span>',nd:'<span class="status-badge status-nd">—</span>'};
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="td-num">${String(vi+1).padStart(2,'0')}</td>
      <td><input class="cell-in" type="text" value="${item.produto}" placeholder="Nome do insumo" onchange="dados.itens[${ri}].produto=this.value;salvar();renderResumo()"></td>
      <td><select class="cell-sel" onchange="dados.itens[${ri}].categoria=this.value;salvar();render()">${dados.categorias.map(c=>`<option${c===item.categoria?' selected':''}>${c}</option>`).join('')}</select></td>
      <td><select class="cell-sel" onchange="dados.itens[${ri}].unidade=this.value;salvar()"><option${item.unidade==='kg'?' selected':''}>kg</option><option${item.unidade==='g'?' selected':''}>g</option><option${item.unidade==='L'?' selected':''}>L</option><option${item.unidade==='ml'?' selected':''}>ml</option><option${item.unidade==='un'?' selected':''}>un</option><option${item.unidade==='cx'?' selected':''}>cx</option><option${item.unidade==='fardo'?' selected':''}>fardo</option><option${item.unidade==='saco'?' selected':''}>saco</option></select></td>
      <td><input class="cell-in cell-num" type="number" min="0" step="0.1" value="${item.minimo}" placeholder="0" onchange="dados.itens[${ri}].minimo=this.value;salvar();renderResumo();renderTabela()"></td>
      <td><input class="cell-in cell-num" type="number" min="0" step="0.1" value="${item.qtd}" placeholder="0" onchange="dados.itens[${ri}].qtd=this.value;salvar();renderResumo();renderTabela()"></td>
      <td style="text-align:center">${stMap[st]}</td>
      <td><input class="cell-in" type="text" value="${item.obs}" placeholder="—" onchange="dados.itens[${ri}].obs=this.value;salvar()"></td>
      <td><button class="btn-rem" onclick="removeItem(${ri})">×</button></td>`;
    tbody.appendChild(tr);
  });
}

function renderResumo(){
  const counts={ok:0,baixo:0,critico:0,total:dados.itens.length};
  dados.itens.forEach(i=>{const s=getStatus(i);if(s==='ok')counts.ok++;else if(s==='baixo')counts.baixo++;else if(s==='critico')counts.critico++;});
  document.getElementById('resumo').innerHTML=`
    <div class="resumo-card total"><span class="resumo-num">${counts.total}</span><span class="resumo-label">Total de itens</span></div>
    <div class="resumo-card ok"><span class="resumo-num">${counts.ok}</span><span class="resumo-label">Estoque OK</span></div>
    <div class="resumo-card baixo"><span class="resumo-num">${counts.baixo}</span><span class="resumo-label">Estoque baixo</span></div>
    <div class="resumo-card critico"><span class="resumo-num">${counts.critico}</span><span class="resumo-label">Estoque crítico</span></div>`;
}

function addItem(){dados.itens.push(itemPadrao());salvar();render();}
function removeItem(i){if(!confirm('Remover este insumo?'))return;dados.itens.splice(i,1);salvar();render();}
function addCategoria(){const n=prompt('Nome da categoria:');if(!n)return;dados.categorias.push(n);salvar();render();}
function removeCategoria(c){
  const emUso=dados.itens.filter(i=>i.categoria===c).length;
  const msg=emUso>0?`A categoria "${c}" está em uso em ${emUso} item(ns). Remover a categoria vai deixar esses itens sem categoria. Continuar?`:`Remover a categoria "${c}"?`;
  if(!confirm(msg))return;
  dados.categorias=dados.categorias.filter(x=>x!==c);
  dados.itens.forEach(i=>{if(i.categoria===c)i.categoria=dados.categorias[0]||'';});
  if(catAtiva===c)catAtiva='Todas';
  salvar();render();
}
function setFiltro(f){filtro=f;document.querySelectorAll('.btn-filtro').forEach(b=>b.classList.remove('ativo'));document.getElementById('f'+f.charAt(0).toUpperCase()+f.slice(1)).classList.add('ativo');renderTabela();}

function salvar(){
  dados.estab=document.getElementById('estab').value;
  dados.data=document.getElementById('data').value;
  dados.resp=document.getElementById('resp').value;
  dados.consultor=document.getElementById('consultor').value;
  dados.periodo=document.getElementById('periodo').value;
  try{localStorage.setItem(KEY,JSON.stringify(dados));}catch(e){}
}
function carregar(){try{const r=localStorage.getItem(KEY);if(r)dados=JSON.parse(r);}catch(e){}}

carregar();
if(!dados.data)dados.data=hoje();
// Itens de exemplo se vazio
if(dados.itens.length===0){
  [['Filé de frango','Proteínas','kg'],['Patinho bovino','Proteínas','kg'],['Alho','Hortifrúti','kg'],['Cebola','Hortifrúti','kg'],['Arroz','Secos','saco'],['Óleo de soja','Secos','L'],['Queijo mussarela','Frios e Laticínios','kg']].forEach(([p,c,u])=>{dados.itens.push({produto:p,categoria:c,unidade:u,minimo:'',qtd:'',obs:'',});});
}
setFiltro('todos');
render();
</script>
</body>
</html>
