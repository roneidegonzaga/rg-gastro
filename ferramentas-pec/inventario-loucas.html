<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../dose-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inventário de Louças e Utensílios — RG Gastrô</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#011E34;--navy2:#062d4e;--gold:#F7B700;--gold2:#FCC740;--coral:#F25C54;--cream:#FFFEE8;--cream2:#F0EECC;--white:#ffffff;--gray:#6b7280;--gray-l:#e5e7eb;--ok:#22c55e;--ok-l:#dcfce7;--warn:#f59e0b;--warn-l:#fef3c7;--nao:#ef4444;--nao-l:#fee2e2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--navy);min-height:100vh;}
  .header{background:var(--navy);padding:20px 32px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--gold);}
  .header-eyebrow{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
  .header-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--white);}
  .id-bar{background:var(--navy2);padding:12px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 20px;}
  .id-field{display:flex;flex-direction:column;gap:3px;}
  .id-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
  .id-input{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;padding:3px 0;outline:none;width:100%;}
  .id-input::placeholder{color:rgba(255,255,255,.3);}
  .id-input:focus{border-bottom-color:var(--gold);}
  .main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px;}
  .resumo{background:var(--navy);border-radius:8px;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
  .resumo-card{background:rgba(255,255,255,.06);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px;}
  .resumo-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1;color:var(--gold);}
  .resumo-card.ok .resumo-num{color:#4ade80;}
  .resumo-card.alerta .resumo-num{color:#fbbf24;}
  .resumo-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.5);}
  .setor-section{background:var(--white);border-radius:8px;box-shadow:0 1px 6px rgba(1,30,52,.08);overflow:hidden;margin-bottom:0;}
  .setor-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .setor-titulo{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--white);}
  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--cream2);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);padding:8px 10px;text-align:left;border-bottom:1px solid var(--gray-l);}
  thead th.c{text-align:center;}
  tbody tr:hover{background:#fafaf2;}
  td{padding:7px 10px;border-bottom:1px solid var(--gray-l);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .td-num{font-family:'Playfair Display',serif;font-size:12px;font-weight:600;color:var(--gold);text-align:center;width:40px;}
  .cell-in{border:1px solid var(--gray-l);border-radius:3px;padding:4px 6px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--navy);background:var(--cream);outline:none;width:100%;}
  .cell-in:focus{border-color:var(--gold);}
  .cell-num{text-align:center;width:70px;}
  .diff-pos{color:var(--ok);font-weight:700;}
  .diff-neg{color:var(--nao);font-weight:700;}
  .btn-rem{background:transparent;border:none;color:var(--gray-l);font-size:15px;cursor:pointer;padding:0 3px;transition:color .15s;}
  .btn-rem:hover{color:var(--nao);}
  .btn-add-item{width:100%;padding:10px;border:1.5px dashed var(--gold);border-top:none;background:transparent;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;border-radius:0 0 8px 8px;}
  .btn-add-item:hover{background:var(--gold);color:var(--navy);}
  .btn-add-setor{width:100%;padding:12px;border:2px dashed var(--navy2);border-radius:8px;background:transparent;color:var(--navy2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:1px;text-transform:uppercase;}
  .btn-add-setor:hover{background:var(--navy);color:white;border-color:var(--navy);}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .btn-acao{padding:10px 24px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .2s;}
  .btn-acao.primario{background:var(--gold);color:var(--navy);}
  .btn-acao.primario:hover{background:var(--gold2);}
  .btn-acao.secundario{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-acao.secundario:hover{background:var(--navy);color:white;}
  @media print{.acoes,.btn-add-item,.btn-add-setor,.btn-rem{display:none;}body{background:white;}}
</style>
</head>
<body>
<div class="header">
  <div><div class="header-eyebrow">RG Gastrô Educação</div><div class="header-title">Inventário de Louças e Utensílios</div></div>
</div>
<div class="id-bar">
  <div class="id-field"><span class="id-label">Estabelecimento</span><input class="id-input" type="text" id="estab" placeholder="Nome do cliente" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Data</span><input class="id-input" type="date" id="data" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Responsável</span><input class="id-input" type="text" id="resp" placeholder="Nome" onchange="salvar()"></div>
  <div class="id-field"><span class="id-label">Consultor(a)</span><input class="id-input" type="text" id="consultor" placeholder="Seu nome" onchange="salvar()"></div>
</div>
<div class="main">
  <div class="resumo" id="resumo"></div>
  <div id="setoresContainer"></div>
  <button class="btn-add-setor" onclick="addSetor()">+ Adicionar setor</button>
  <div class="acoes">
    <button class="btn-acao secundario" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn-acao primario" onclick="salvar()">Salvar</button>
  </div>
</div>
<script>
const KEY='rgGastro_inv_loucas';
const CORES=['#011E34','#3B82F6','#F25C54','#22C55E','#A855F7','#F97316'];
let dados={estab:'',data:'',resp:'',consultor:'',setores:[{nome:'Salão',cor:CORES[0],itens:[]},{nome:'Cozinha',cor:CORES[1],itens:[]},{nome:'Bar',cor:CORES[2],itens:[]}]};

function hoje(){return new Date().toISOString().split('T')[0];}
function itemPadrao(){return{descricao:'',qtdInicial:'',qtdAtual:'',obs:''};}

function getDiff(item){
  const i=parseFloat(item.qtdInicial),a=parseFloat(item.qtdAtual);
  if(isNaN(i)||isNaN(a))return null;
  return a-i;
}

function render(){
  document.getElementById('estab').value=dados.estab||'';
  document.getElementById('data').value=dados.data||'';
  document.getElementById('resp').value=dados.resp||'';
  document.getElementById('consultor').value=dados.consultor||'';
  renderSetores();
  renderResumo();
}

function renderResumo(){
  let totalItens=0,totalQtd=0,totalQuebras=0;
  dados.setores.forEach(s=>s.itens.forEach(i=>{
    totalItens++;
    const d=getDiff(i);
    if(d!==null&&d<0)totalQuebras+=Math.abs(d);
    if(i.qtdAtual)totalQtd+=parseFloat(i.qtdAtual)||0;
  }));
  document.getElementById('resumo').innerHTML=`
    <div class="resumo-card"><span class="resumo-num">${totalItens}</span><span class="resumo-label">Tipos de item</span></div>
    <div class="resumo-card"><span class="resumo-num">${dados.setores.length}</span><span class="resumo-label">Setores</span></div>
    <div class="resumo-card alerta"><span class="resumo-num">${totalQuebras.toFixed(0)}</span><span class="resumo-label">Perdas / quebras</span></div>
    <div class="resumo-card ok"><span class="resumo-num">${totalQtd.toFixed(0)}</span><span class="resumo-label">Peças em estoque</span></div>`;
}

function renderSetores(){
  const c=document.getElementById('setoresContainer');
  c.innerHTML='';
  dados.setores.forEach((setor,si)=>{
    const div=document.createElement('div');
    div.className='setor-section';
    div.style.marginBottom='20px';
    div.innerHTML=`
      <div class="setor-header" style="background:${setor.cor}">
        <div class="setor-titulo">
          <input style="background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:white;font-family:'Playfair Display',serif;font-size:16px;font-weight:600;outline:none;width:180px"
            value="${setor.nome}" onchange="dados.setores[${si}].nome=this.value;salvar()">
        </div>
        <button onclick="removeSetor(${si})" style="background:rgba(255,255,255,.15);border:none;color:white;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:10px">✕ Remover</button>
      </div>
      <table>
        <thead><tr>
          <th style="width:40px" class="c">#</th>
          <th>Descrição do item</th>
          <th class="c" style="width:90px">Qtd Inicial</th>
          <th class="c" style="width:90px">Qtd Atual</th>
          <th class="c" style="width:80px">Diferença</th>
          <th style="width:140px">Observação</th>
          <th style="width:30px"></th>
        </tr></thead>
        <tbody>${setor.itens.map((item,ii)=>{
          const d=getDiff(item);
          const diffStr=d===null?'—':`<span class="${d<0?'diff-neg':'diff-pos'}">${d>0?'+':''}${d}</span>`;
          return `<tr>
            <td class="td-num">${String(ii+1).padStart(2,'0')}</td>
            <td><input class="cell-in" type="text" value="${item.descricao}" placeholder="Ex: Prato raso branco..." onchange="dados.setores[${si}].itens[${ii}].descricao=this.value;salvar()"></td>
            <td><input class="cell-in cell-num" type="number" min="0" value="${item.qtdInicial}" placeholder="0" onchange="dados.setores[${si}].itens[${ii}].qtdInicial=this.value;salvar();render()"></td>
            <td><input class="cell-in cell-num" type="number" min="0" value="${item.qtdAtual}" placeholder="0" onchange="dados.setores[${si}].itens[${ii}].qtdAtual=this.value;salvar();render()"></td>
            <td style="text-align:center">${diffStr}</td>
            <td><input class="cell-in" type="text" value="${item.obs}" placeholder="—" onchange="dados.setores[${si}].itens[${ii}].obs=this.value;salvar()"></td>
            <td><button class="btn-rem" onclick="removeItem(${si},${ii})">×</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table>
      <button class="btn-add-item" onclick="addItem(${si})">+ Adicionar item</button>`;
    c.appendChild(div);
  });
}

function addItem(si){dados.setores[si].itens.push(itemPadrao());salvar();render();}
function removeItem(si,ii){dados.setores[si].itens.splice(ii,1);salvar();render();}
function addSetor(){const n=prompt('Nome do setor:');if(!n)return;dados.setores.push({nome:n,cor:CORES[dados.setores.length%CORES.length],itens:[]});salvar();render();}
function removeSetor(si){if(!confirm(`Remover o setor "${dados.setores[si].nome}"?`))return;dados.setores.splice(si,1);salvar();render();}
function salvar(){dados.estab=document.getElementById('estab').value;dados.data=document.getElementById('data').value;dados.resp=document.getElementById('resp').value;dados.consultor=document.getElementById('consultor').value;try{localStorage.setItem(KEY,JSON.stringify(dados));}catch(e){}}
function carregar(){try{const r=localStorage.getItem(KEY);if(r)dados=JSON.parse(r);}catch(e){}}

carregar();
if(!dados.data)dados.data=hoje();
if(dados.setores[0]&&dados.setores[0].itens.length===0){
  ['Prato raso','Prato fundo','Copo água','Copo suco','Xícara café','Colher sobremesa','Garfo','Faca'].forEach(d=>dados.setores[0].itens.push({descricao:d,qtdInicial:'',qtdAtual:'',obs:''}));
}
render();
</script>
</body>
</html>
