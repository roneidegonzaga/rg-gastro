<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Gastrô | Painel de gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* marca RG Gastro (manual 2022) */
  --charcoal: #011e34;      /* navy institucional */
  --charcoal-2: #04283f;    /* navy da sidebar */
  --cream: #fff1e6; --cream-dim: #f9d8bc; --muted: #a3bccf;
  --gold: #fcc740;          /* amarelo marca (acento em fundo escuro) */
  --gold-dark: #025291;     /* azul marca (links e acentos em fundo claro) */
  --gold-soft: rgba(252,199,64,0.16);
  --bdark: rgba(255,241,230,0.13); --bdark-s: rgba(255,241,230,0.38);
  --bg: #fff1e6; --card: #ffffff; --ink: #011e34; --ink-soft: #33475c; --ink-muted: #52677a;
  --line: #f3ddc8;
  --green: #256c4c; --green-bg: #e8f3ed;
  --red: #b12839; --red-bg: #fae8ea;
  --blue: #025291; --blue-bg: #e4eef7;
  --amber: #815a06; --amber-bg: #fff3d5;
  --purple: #b13931; --purple-bg: #fdeae8;   /* coral da marca */
  --coral: #f25c54; --yellow: #ffb700; --blue-soft: #5b91bc;
}
html, body { height: 100%; }
body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--ink); display: flex; overflow: hidden; font-size: 13px; }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20xmlns%3Axlink%3D%22http%3A%2F%2Fwww.w3.org%2F1999%2Fxlink%22%20width%3D%221920%22%20height%3D%221080%22%20viewBox%3D%220%200%201920%201080%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22clip-Moodboard_-_01_226%22%3E%3Crect%20width%3D%221920%22%20height%3D%221080%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cg%20id%3D%22Moodboard_-_01_226%22%20clip-path%3D%22url(%23clip-Moodboard_-_01_226)%22%3E%3Cg%20id%3D%22Grupo_115%22%3E%3Cpath%20id%3D%22Caminho_335%22%20d%3D%22M222.051%2C1080H356.546c27.607-68.316%2C25.009-147.755-17.1-217.924C320.549%2C830.575%2C245.167%2C729.085%2C0%2C670.832V786.943c5.888%2C1.68%2C166.18%2C47.6%2C224.528%2C115.087C249.672%2C931.11%2C289.307%2C1009.773%2C222.051%2C1080Z%22%20fill%3D%22%23f9d8bc%22%2F%3E%3Cpath%20id%3D%22Caminho_336%22%20d%3D%22M1567.949%2C257.89C1635.935%2C124.611%2C1664.125%2C15.748%2C1668.45%2C0H1527.865c-8.756%2C19.273-45.793%2C131.531-218.351%2C131.233-36.852-.064-151.334-2.305-235.021-131.233H938.34c39.752%2C90.251%2C107.173%2C166.889%2C195.79%2C211%2C93.829%2C46.927%2C226.617%2C49.374%2C333.146.617-1.343%2C2.693-15.441%2C30.782-29.462%2C55.551C1381.459%2C278.492%2C838.878%2C372.566%2C594.481%2C519c-62.468%2C37.43-120.874%2C83.444-150.216%2C151.3-62.573%2C144.339%2C11.046%2C311.151%2C164.295%2C349.458C811.446%2C1070.475%2C1214.067%2C834.638%2C1501.95%2C374c52.108-1.572%2C309.81-8.122%2C418.05-10.995V248.858C1847.224%2C250.723%2C1616.029%2C256.59%2C1567.949%2C257.89ZM619.058%2C901c-91.207-37.128-122.528-168.935-8.923-254.064%2C185.321-138.87%2C535.581-202.7%2C741.127-244.986C1000.582%2C892.237%2C688.237%2C929.16%2C619.058%2C901Z%22%20fill%3D%22%23f9d8bc%22%2F%3E%3Cpath%20id%3D%22Caminho_337%22%20d%3D%22M1572.95%2C696.253c88.58-11.547%2C197.416%2C54.309%2C159.466%2C145.485-27.221%2C65.4%2C88.211%2C107.238%2C115.924%2C41.324%2C103.5-246.165-322.893-429.133-509.961-171.562-121.084%2C166.719%2C7.7%2C338.238%2C32.476%2C368.5h165.233C1338.29%2C941.483%2C1399.432%2C718.872%2C1572.95%2C696.253Z%22%20fill%3D%22%23f9d8bc%22%2F%3E%3Cpath%20id%3D%22Caminho_338%22%20d%3D%22M616.27%2C0H477.884C354.94%2C176.889%2C89.8%2C250.047%2C0%2C274.872v117.44C119.2%2C363.549%2C480.493%2C268.834%2C616.27%2C0Z%22%20fill%3D%22%23f9d8bc%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E") center / cover no-repeat; opacity: .38; }
.sidebar, .main { position: relative; z-index: 1; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

/* SIDEBAR */
.sidebar { width: 232px; min-width: 232px; height: 100vh; display: flex; flex-direction: column; background: var(--charcoal); border-right: none; z-index: 50; color: var(--cream); transition: margin-left .25s; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 15px 16px; border-bottom: 1px solid var(--bdark); cursor: pointer; flex-wrap: wrap; }
.sb-logo { height: 40px; width: 40px; display: block; }
.sb-brand .t1 { font-weight: 800; font-size: 16px; }
.sb-brand .t2 { width: 100%; }
.sb-brand .t2 { font-size: 8.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.sb-nav { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
.sb-nav::-webkit-scrollbar { width: 4px; }
.sb-nav::-webkit-scrollbar-thumb { background: var(--bdark); border-radius: 4px; }
.nav-sec { font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); padding: 14px 12px 6px; font-weight: 700; }
.nav-it { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--cream-dim); margin-bottom: 2px; transition: all .15s; width: 100%; border: none; background: none; font-family: 'Manrope', sans-serif; text-align: left; }
.nav-it:hover { background: rgba(255,241,230,0.08); color: var(--cream); }
.nav-it.active { background: var(--gold); color: var(--charcoal); font-weight: 800; }
.nav-it.active svg { opacity: 1; }
.nav-it svg { flex-shrink: 0; opacity: .85; }
.nav-it:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .btn-exit:focus-visible, .seg button:focus-visible { outline: 2px solid var(--gold-dark); outline-offset: 2px; }
.sb-user { border-top: 1px solid var(--bdark); padding: 12px 13px; display: flex; align-items: center; gap: 10px; }
.sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--coral); border: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0; }
.sb-user .u-name { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user .u-role { font-size: 9px; color: var(--muted); text-transform: capitalize; }
.sb-user .u-info { flex: 1; min-width: 0; }
.btn-exit { background: none; border: 1px solid var(--bdark-s); color: var(--cream-dim); border-radius: 999px; padding: 5px 11px; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: 'Manrope', sans-serif; font-weight: 700; }
.btn-exit:hover { color: var(--charcoal); background: var(--cream); border-color: var(--cream); }

/* MAIN */
.main { flex: 1; height: 100vh; display: flex; flex-direction: column; min-width: 0; }
.topbar { height: 56px; min-height: 56px; display: flex; align-items: center; gap: 13px; padding: 0 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.82); backdrop-filter: blur(4px); }
.burger { display: none; background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 14px; }
.tb-title { font-weight: 800; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .1px; }
.tb-badge { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--gold-dark); background: #fff7ee; white-space: nowrap; font-weight: 700; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 13px; }
.sync { display: flex; align-items: center; gap: 7px; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; font-weight: 600; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); }
.sync.saving .dot { background: var(--yellow); animation: pulse 1s infinite; }
.sync.saved .dot { background: var(--green); }
.sync.error .dot { background: var(--red); }
@keyframes pulse { 50% { opacity: .35; } }
.content { flex: 1; min-height: 0; position: relative; }
#view { position: absolute; inset: 0; overflow-y: auto; padding: 24px 26px 60px; }
#frame-wrap { position: absolute; inset: 0; display: none; flex-direction: column; background: #fff8f0; }
#frame-wrap.show { display: flex; }
.frame-bar { display: flex; align-items: center; gap: 12px; padding: 9px 18px; background: var(--charcoal); color: var(--cream); font-size: 11.5px; }
.frame-bar .fb-back { cursor: pointer; color: var(--gold); font-weight: 700; }
.frame-bar .fb-back:hover { text-decoration: underline; }
.frame-bar .fb-cli { color: var(--cream-dim); font-weight: 400; }
#frame { flex: 1; width: 100%; border: none; }

/* COMPONENTES */
.page-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-weight: 800; font-size: 23px; letter-spacing: -.2px; }
.page-head .ph-sub { font-size: 11.5px; color: var(--ink-muted); font-weight: 500; }
.page-head .ph-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: none; border-radius: 999px; padding: 9px 18px; font-family: 'Manrope', sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: .2px; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 7px; }
.btn-p { background: var(--charcoal); color: var(--cream); }
.btn-p:hover { background: var(--gold-dark); transform: translateY(-1px); }
.btn-o { background: var(--card); color: var(--ink); border: 1.5px solid var(--charcoal); }
.btn-o:hover { border-color: var(--gold-dark); color: var(--gold-dark); transform: translateY(-1px); }
.btn-sm { padding: 5px 12px; font-size: 10px; border-width: 1px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.seg button { border: none; background: none; padding: 7px 14px; font-family: 'Manrope', sans-serif; font-size: 10.5px; font-weight: 700; color: var(--ink-muted); cursor: pointer; border-right: 1px solid var(--line); transition: all .15s; }
.seg button:last-child { border-right: none; }
.seg button.active { background: var(--charcoal); color: var(--cream); }
.mini-select, .mini-input { border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; color: var(--ink-soft); padding: 7px 12px; }
.mini-select:focus, .mini-input:focus { outline: none; border-color: var(--gold-dark); }
.prod-multi { position: relative; display: inline-block; }
.prod-multi summary { list-style: none; cursor: pointer; }
.prod-multi summary::-webkit-details-marker { display: none; }
.prod-multi[open] summary { border-color: var(--gold-dark); }
.prod-multi-panel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; width: 260px; max-width: 80vw; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.prod-multi-actions { display: flex; gap: 12px; margin: 8px 0; font-size: 10.5px; }
.prod-multi-actions button { background: none; border: none; color: var(--gold-dark); font-weight: 700; cursor: pointer; padding: 0; }
.prod-multi-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.prod-multi-item { display: flex; align-items: center; gap: 8px; font-size: 11.5px; cursor: pointer; }
.filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-bar .fb-sep { font-size: 10px; color: var(--ink-muted); font-weight: 600; }
.card-p { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 17px 19px; min-width: 0; box-shadow: 0 1px 2px rgba(1,30,52,.03); }
.p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; flex-wrap: wrap; }
.p-title { font-size: 12.5px; font-weight: 800; }
.p-tag { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; }
.p-link { margin-left: auto; font-size: 10.5px; color: var(--gold-dark); cursor: pointer; font-weight: 800; }
.p-link:hover { text-decoration: underline; }
.grid { display: grid; gap: 13px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1fr 1fr 1fr; }
.g21 { grid-template-columns: 1.7fr 1fr; } .g12 { grid-template-columns: 1fr 1.7fr; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px 12px; border-top: 4px solid var(--yellow); transition: transform .15s, box-shadow .15s; }
.kpi.clickable { cursor: pointer; }
.kpi:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(1,30,52,.08); }
.kpi.k-green { border-top-color: var(--green); } .kpi.k-red { border-top-color: var(--coral); }
.kpi.k-blue { border-top-color: var(--gold-dark); } .kpi.k-purple { border-top-color: var(--coral); }
.kpi .k-label { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; }
.kpi .k-value { font-weight: 800; font-size: 23px; margin-top: 7px; line-height: 1.05; letter-spacing: -.3px; }
.kpi .k-foot { font-size: 10px; color: var(--ink-muted); margin-top: 7px; font-weight: 500; }
.kpi .k-foot b { color: var(--ink-soft); }
.chart-box { position: relative; height: 230px; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px; font-size: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.rowlink { cursor: pointer; }
.tbl tr.rowlink:hover td { background: #fff6ec; }
.chip { display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .4px; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; }
.c-green { background: var(--green-bg); color: var(--green); } .c-red { background: var(--red-bg); color: var(--red); }
.c-blue { background: var(--blue-bg); color: var(--blue); } .c-amber { background: var(--amber-bg); color: var(--amber); }
.c-purple { background: var(--purple-bg); color: var(--purple); } .c-gray { background: #f4e8da; color: var(--ink-muted); }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--ink-muted); font-size: 13px; padding: 3px 6px; border-radius: 8px; }
.icon-btn:hover { color: var(--ink); background: #f6e8d8; }
.empty { padding: 24px 10px; text-align: center; font-size: 11.5px; color: var(--ink-muted); font-weight: 500; line-height: 1.7; }
.bar-wrap { background: #f6e8d8; border-radius: 999px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--gold-dark); transition: width .5s cubic-bezier(.2,.7,.3,1); }
.funil-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 11px; }
.funil-row .f-lab { width: 108px; color: var(--ink-soft); font-weight: 700; flex-shrink: 0; }
.funil-row .f-bar { flex: 1; background: #f6e8d8; border-radius: 999px; height: 16px; overflow: hidden; }
.funil-row .f-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.7,.3,1); }
.funil-row .f-num { width: 118px; text-align: right; color: var(--ink-muted); font-weight: 600; flex-shrink: 0; font-size: 10.5px; }

/* KANBAN */
.kanban { display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px; align-items: start; }
.kb-col { background: #fbe9d6; border-radius: 14px; padding: 10px; min-height: 120px; transition: background .15s, box-shadow .15s; }
.kb-col.drag-over { background: var(--blue-bg); box-shadow: inset 0 0 0 2px var(--gold-dark); }
.kb-col .kb-head { display: flex; align-items: center; gap: 7px; padding: 2px 4px 10px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); }
.kb-col .kb-n { margin-left: auto; background: var(--card); border-radius: 999px; padding: 1px 8px; font-size: 10px; color: var(--ink-muted); font-weight: 700; }
.kb-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; cursor: grab; transition: box-shadow .15s, transform .15s; }
.kb-card:hover { box-shadow: 0 4px 14px rgba(1,30,52,.10); transform: translateY(-1px); }
.kb-card.dragging { opacity: .45; cursor: grabbing; }
.kb-card .kc-nome { font-size: 12px; font-weight: 800; }
.kb-card .kc-meta { font-size: 10px; color: var(--ink-muted); margin-top: 3px; font-weight: 500; }
.kb-card .kc-val { font-size: 11.5px; font-weight: 800; color: var(--gold-dark); margin-top: 6px; }
.kb-card .kc-mv { display: flex; gap: 5px; margin-top: 8px; }
.kb-card .kc-mv button { flex: 1; border: 1px solid var(--line); background: none; border-radius: 999px; font-size: 10px; padding: 3px; cursor: pointer; color: var(--ink-muted); font-family: 'Manrope', sans-serif; font-weight: 700; }
.kb-card .kc-mv button:hover { border-color: var(--gold-dark); color: var(--gold-dark); }

/* AGENDA */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .cal-dow { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-muted); text-align: center; padding: 4px 0; font-weight: 700; }
.cal .cal-d { background: var(--card); border: 1px solid var(--line); border-radius: 9px; min-height: 52px; padding: 5px 6px; font-size: 10px; color: var(--ink-soft); cursor: pointer; position: relative; transition: border-color .15s, transform .15s; }
.cal .cal-d:hover { border-color: var(--gold-dark); transform: translateY(-1px); }
.cal .cal-d.out { opacity: .35; }
.cal .cal-d.today { border-color: var(--yellow); border-width: 2px; background: #fff7e2; }
.cal .cal-d .dnum { font-weight: 800; }
.cal .cal-d .dots { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.cal .cal-d .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.ag-item { display: flex; align-items: center; gap: 11px; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 12px; }
.ag-item:last-child { border-bottom: none; }
.ag-item .ag-when { min-width: 88px; font-size: 10.5px; color: var(--ink-muted); font-weight: 600; }
.ag-item .ag-when b { display: block; color: var(--ink); font-size: 12px; font-weight: 800; }
.ag-item .ag-tit { flex: 1; min-width: 0; }
.ag-item .ag-tit small { display: block; color: var(--ink-muted); font-size: 10px; font-weight: 500; }

/* DOSE launcher */
.dose-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 9px; }
.dose-t { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; background: var(--card); display: flex; align-items: center; gap: 9px; transition: all .15s; font-size: 11px; font-weight: 600; }
.dose-t:hover { border-color: var(--gold-dark); background: #f3f7fb; transform: translateY(-1px); }
.dose-t .code { font-size: 8.5px; color: var(--gold-dark); background: var(--blue-bg); border: none; border-radius: 999px; padding: 2px 7px; flex-shrink: 0; font-weight: 800; }
.dose-t .has-data { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* CURSOS: stepper */
.step-row { display: flex; align-items: center; gap: 11px; padding: 9px 6px; border-radius: 10px; cursor: pointer; transition: background .15s; }
.step-row:hover { background: #fff6ec; }
.step-row .st-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; border: 2px solid var(--line); color: var(--ink-muted); background: #fff; }
.step-row.feita .st-dot { background: var(--green); border-color: var(--green); color: #fff; }
.step-row.atual .st-dot { border-color: var(--gold-dark); color: var(--gold-dark); }
.step-row .st-nome { flex: 1; font-size: 12px; font-weight: 600; }
.step-row.feita .st-nome { color: var(--ink-muted); }
.step-row.atual .st-nome { font-weight: 800; }

/* PROCESSOS */
.proc-card { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.proc-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(1,30,52,.08); }
.bloco { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 13px; overflow: hidden; background: var(--card); }
.bloco .bl-head { display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #fff6ec; border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); }
.bloco .bl-head .icon-btn { margin-left: 0; }
.bloco .bl-head .bl-acts { margin-left: auto; display: flex; gap: 2px; }
.bloco .bl-body { padding: 13px; }
.bloco textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: 'Manrope', sans-serif; font-size: 12.5px; color: var(--ink); background: #fffcf8; min-height: 84px; resize: vertical; }
.bloco textarea:focus { outline: none; border-color: var(--gold-dark); }
.fluxo-prev { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: 11px; }
.fluxo-no { background: var(--blue-bg); border: 1.5px solid var(--gold-dark); color: var(--ink); border-radius: 10px; padding: 8px 16px; font-size: 12px; font-weight: 700; max-width: 420px; text-align: center; }
.fluxo-no.decisao { background: var(--amber-bg); border-color: var(--amber); border-radius: 999px; }
.fluxo-seta { color: var(--gold-dark); font-size: 15px; line-height: 1.4; }
.mapa-prev { margin-top: 11px; }
.mapa-centro { display: inline-block; background: var(--charcoal); color: var(--cream); border-radius: 999px; padding: 8px 18px; font-size: 12.5px; font-weight: 800; margin-bottom: 9px; }
.mapa-ramo { margin-left: 14px; padding-left: 14px; border-left: 2px solid var(--cream-dim); }
.mapa-item { position: relative; padding: 4px 0 4px 14px; font-size: 12px; font-weight: 600; }
.mapa-item::before { content: ''; position: absolute; left: -2px; top: 14px; width: 12px; height: 2px; background: var(--cream-dim); }
.mapa-item.n2 { margin-left: 22px; font-weight: 500; color: var(--ink-soft); }
.bloco .bl-img { max-width: 100%; border-radius: 10px; display: block; margin-top: 9px; }

/* TIMELINE consultoria */
.tl-wrap { display: flex; gap: 0; overflow-x: auto; padding: 9px 2px 4px; }
.tl-no { min-width: 130px; position: relative; padding-top: 26px; cursor: pointer; }
.tl-no::before { content: ''; position: absolute; top: 9px; left: 0; right: 0; height: 3px; background: var(--line); }
.tl-no:first-child::before { left: 50%; }
.tl-no:last-child::before { right: 50%; }
.tl-no .tl-dot { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 17px; height: 17px; border-radius: 50%; background: #fff; border: 3px solid var(--line); z-index: 1; }
.tl-no.feito .tl-dot { background: var(--green); border-color: var(--green); }
.tl-no.fazendo .tl-dot { background: #fff; border-color: var(--gold-dark); }
.tl-no .tl-nome { font-size: 11px; font-weight: 700; text-align: center; padding: 0 8px; }
.tl-no.feito .tl-nome { color: var(--ink-muted); }
.tl-no .tl-prazo { font-size: 9.5px; color: var(--ink-muted); text-align: center; margin-top: 2px; font-weight: 600; }
.tl-no:hover .tl-nome { color: var(--gold-dark); }

/* QUADRO visual */
.qd-bar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 9px; }
.qd-dica { font-size: 9.5px; color: var(--ink-muted); font-weight: 600; }
.qd-canvas { position: relative; min-height: 380px; border: 1.5px dashed var(--line); border-radius: 12px; overflow: auto; background-image: radial-gradient(#eddfc9 1px, transparent 1px); background-size: 22px 22px; }
.qd-svg { position: absolute; left: 0; top: 0; pointer-events: auto; }
.qd-no { position: absolute; padding: 9px 26px 9px 13px; font-size: 11.5px; font-weight: 700; cursor: grab; user-select: none; touch-action: none; max-width: 200px; box-shadow: 0 2px 7px rgba(1,30,52,.09); }
.qd-etapa { background: var(--blue-bg); border: 2px solid var(--gold-dark); border-radius: 10px; color: var(--ink); }
.qd-decisao { background: var(--amber-bg); border: 2px solid var(--amber); border-radius: 999px; }
.qd-fim { background: var(--charcoal); color: var(--cream); border: 2px solid var(--charcoal); border-radius: 999px; }
.qd-lig { outline: 3px solid var(--coral); }
.qd-x { position: absolute; top: 3px; right: 5px; background: none; border: none; color: inherit; opacity: .45; cursor: pointer; font-size: 10px; }
.qd-x:hover { opacity: 1; }
.kb-mini { display: flex; gap: 9px; overflow-x: auto; margin-top: 11px; align-items: flex-start; }
.kb-mini-col { background: #fbe9d6; border-radius: 10px; padding: 8px; min-width: 150px; }
.kb-mini-head { font-size: 9.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); padding: 2px 4px 7px; display: flex; justify-content: space-between; }
.kb-mini-head span { background: #fff; border-radius: 999px; padding: 0 7px; }
.kb-mini-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 11px; font-weight: 600; margin-bottom: 6px; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(1,30,52,.55); z-index: 120; display: none; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal-bg.show { display: flex; }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 460px; padding: 24px 26px; animation: fadeUp .22s ease; }
.modal h3 { font-weight: 800; font-size: 18px; margin-bottom: 16px; letter-spacing: -.2px; }
.modal .f-row { margin-bottom: 13px; }
.modal label { display: block; font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; font-weight: 700; }
.modal input, .modal select, .modal textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: 'Manrope', sans-serif; font-size: 12.5px; color: var(--ink); background: #fffcf8; }
.modal textarea { min-height: 74px; resize: vertical; }
.modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--gold-dark); }
.modal .m-actions { display: flex; gap: 9px; margin-top: 18px; }
.modal .m-actions .btn { flex: 1; justify-content: center; }
.modal .m-del { color: var(--red); font-size: 10.5px; cursor: pointer; text-align: center; margin-top: 12px; font-weight: 700; }
.modal .m-del:hover { text-decoration: underline; }
.f-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.loader { position: fixed; inset: 0; background: var(--cream); z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .4s; color: var(--ink); }
.loader.hide { opacity: 0; pointer-events: none; }
.loader .l-logo { width: 150px; height: auto; animation: breathe 1.6s infinite; }
@keyframes breathe { 50% { transform: scale(1.07); opacity: .8; } }
.loader .l-text { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(1,30,52,.5); z-index: 40; }
.demo-tip { background: var(--charcoal); color: var(--cream-dim); border-radius: 14px; padding: 13px 17px; font-size: 11px; margin-bottom: 16px; display: none; }
.demo-tip b { color: var(--gold); }

@media (max-width: 1150px) { .kanban { grid-template-columns: repeat(3, 1fr); } .g3 { grid-template-columns: 1fr; } }
@media (max-width: 950px) {
  .sidebar { position: fixed; left: 0; top: 0; margin-left: -250px; }
  .sidebar.open { margin-left: 0; }
  .overlay.show { display: block; }
  .burger { display: block; }
  .g2, .g21, .g12, .g3 { grid-template-columns: 1fr; }
  .kanban { grid-template-columns: 1fr 1fr; }
  #view { padding: 16px 13px 50px; }
  .card-p { overflow-x: auto; }
  .card-p table.tbl { min-width: 540px; }
  .page-head h1 { font-size: 19px; }
  .page-head .ph-actions { width: 100%; margin-left: 0; }
  .seg { max-width: 100%; overflow-x: auto; }
  .filter-bar { width: 100%; }
  .prod-multi-panel { left: 0; right: 0; width: auto; }
  .modal { padding: 18px 16px; }
  .tb-badge { display: none; }
}
@media (max-width: 600px) {
  .kanban { grid-template-columns: 1fr; }
  .kpi .k-value { font-size: 19px; }
}
</style>

  /* ================= HELPERS ================= */
  function $(id){ return document.getElementById(id); }

  function brl(v){ return 'R$ ' + (parseFloat(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function brlS(v){
    v = parseFloat(v) || 0;
    if (Math.abs(v) >= 1000000) return 'R$ ' + (v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi';
    if (Math.abs(v) >= 10000) return 'R$ ' + (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mil';

  }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  function fmtD(iso){ if (!iso) return ''; var p = String(iso).slice(0,10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function fmtDcurta(iso){ if (!iso) return ''; var p = String(iso).slice(0,10).split('-'); return p[2] + '/' + p[1]; }
  function addMes(iso){ var p = iso.split('-').map(Number); var d = new Date(Date.UTC(p[0], p[1], Math.min(p[2], 28))); return d.toISOString().slice(0,10); }

  function demoGet(t){ try { return JSON.parse(localStorage.getItem('rgdemo-' + t) || '[]'); } catch(e){ return []; } }

  var DB = {
    async list(t){
      if (DEMO) return demoGet(t);

      q = (t === 'profiles') ? q.order('criado_em', { ascending: true }) : q.order('id', { ascending: true });
      var r = await q;
      if (r.error) { console.error(t, r.error); setSync('error', 'Erro ao carregar'); return []; }
      return r.data || [];
    },
    async insert(t, row){
      if (DEMO) { var rows = demoGet(t); row.id = Date.now(); rows.push(row); demoSet(t, rows); return row; }

      if (r.error) { console.error(t, r.error); alert('Erro ao salvar: ' + r.error.message); return null; }
      return r.data;
    },
    async update(t, id, patch){
      if (DEMO) { var rows = demoGet(t); var i = rows.findIndex(function(x){ return String(x.id != null ? x.id : x.user_id) === String(id); }); if (i > -1) rows[i] = Object.assign({}, rows[i], patch); demoSet(t, rows); return rows[i]; }

      return r.data && r.data[0];

      if (DEMO) { demoSet(t, demoGet(t).filter(function(x){ return String(x.id != null ? x.id : x.user_id) !== String(id); })); return true; }

      if (r.error) { console.error(t, r.error); alert('Erro ao excluir: ' + r.error.message); return false; }
      return true;
    }
  };

  /* ================= MODAL GENERICO ================= */
  var modalSave = null, modalDel = null, modalDirty = false;
  function openForm(title, fields, data, onSave, onDel){
    data = data || {};
    var html = '<h3>' + esc(title) + '</h3>';
    var i = 0;
    while (i < fields.length) {
      var f = fields[i];
      if (f.half && fields[i+1] && fields[i+1].half) {
        html += '<div class="f-2col">' + fieldHtml(fields[i], data) + fieldHtml(fields[i+1], data) + '</div>';
        i += 2;
      } else { html += fieldHtml(f, data); i++; }
    }
    html += '<div class="m-actions"><button class="btn btn-o" id="m-cancel">Cancelar</button><button class="btn btn-p" id="m-save">Salvar</button></div>';
    if (onDel) html += '<div class="m-del" id="m-del">Excluir este registro</div>';

    $('modal-bg').classList.add('show');
    modalDirty = false;
    $('modal').querySelectorAll('input,select,textarea').forEach(function(el){
      el.addEventListener('input', function(){ modalDirty = true; });
      el.addEventListener('change', function(){ modalDirty = true; });
    });
    modalSave = function(){
      var out = {};
      fields.forEach(function(f){
        var el = $('mf-' + f.k);
        if (!el) return;
        var v = el.value;
        if (v === '__nova') {
          var nova = $('mf-' + f.k + '-nova');
          v = nova ? nova.value.trim() : '';
          if (f.persistCat) salvarCategoriaFixa(f.persistCat, v);
        }
        if (f.type === 'number') v = parseFloat(v) || 0;
        if (v === '') v = null;
        out[f.k] = v;
      });
      onSave(out);
    };
    modalDel = onDel || null;
    $('m-save').onclick = function(){ modalSave(); };
    $('m-cancel').onclick = tryCloseModal;
    if (onDel) $('m-del').onclick = function(){ if (confirm('Excluir mesmo?')) modalDel(); };
    $('modal').querySelectorAll('select[data-custom]').forEach(function(sel){
      sel.addEventListener('change', function(){
        var inp = $(sel.id + '-nova');
        if (inp) { inp.style.display = sel.value === '__nova' ? '' : 'none'; if (sel.value === '__nova') inp.focus(); }
      });
    });
    var first = $('modal').querySelector('input,select,textarea');
    if (first) first.focus();
  }
  function fieldHtml(f, data){
    var v = data[f.k]; if (v == null) v = (f.def != null ? f.def : '');
    var h = '<div class="f-row"><label>' + esc(f.label) + '</label>';
    if (f.type === 'select') {
      var opts = f.options.slice();
      var conhecido = opts.some(function(o){ return String(typeof o === 'object' ? o.v : o) === String(v); });
      if (f.custom && v && !conhecido) opts.push(v);
      h += '<select id="mf-' + f.k + '"' + (f.custom ? ' data-custom="1"' : '') + '>' + opts.map(function(o){
        var val = typeof o === 'object' ? o.v : o, lab = typeof o === 'object' ? o.l : o;
        return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('') + (f.custom ? '<option value="__nova">&#10133; Outra... (escrever)</option>' : '') + '</select>';
      if (f.custom) h += '<input id="mf-' + f.k + '-nova" placeholder="Escreva a nova opção" style="display:none;margin-top:7px">';
    } else if (f.type === 'textarea') {
      h += '<textarea id="mf-' + f.k + '">' + esc(v) + '</textarea>';
    } else {
      h += '<input id="mf-' + f.k + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '"' + (f.type === 'number' ? ' step="0.01"' : '') + '>';
    }
    return h + '</div>';
  }
  function closeModal(){ $('modal-bg').classList.remove('show'); modalDirty = false; }

    }).join('') : '<div class="empty">Nada agendado por enquanto.</div>';

      var atrasada = t.prazo && t.prazo < hoje;
      return '<tr><td>' + esc(t.titulo) + '</td><td style="width:90px;color:' + (atrasada ? 'var(--red)' : 'var(--ink-muted)') + '">' + (t.prazo ? fmtDcurta(t.prazo) : '') + '</td><td style="width:80px"><span class="chip ' + (t.status === 'fazendo' ? 'c-blue' : 'c-gray') + '">' + t.status + '</span></td><td style="width:110px;color:var(--ink-muted);font-size:10.5px">' + esc(t.responsavel || '') + '</td></tr>';
    }).join('') + '</table>' : '<div class="empty">Nenhuma tarefa aberta. Respira.</div>';

          scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'Manrope', size: 9 } } }, y: { stacked: true, ticks: { font: { family: 'Manrope', size: 9 }, callback: function(v){ return brlS(v); } }, grid: { color: '#f3e3d0' } } } } });

  /* ================= METAS E CRESCIMENTO ================= */
  var metasMes = mesAtual();
  VIEWS.metas = async function(){
    var res = await Promise.all([DB.list('rg_metas'), DB.list('rg_financeiro')]);
    var metas = res[0], fin = res[1];
    var meses = [];
    var now = new Date();
    for (var i = 11; i >= 0; i--) { var d = new Date(now.getFullYear(), now.getMonth() - i, 1); meses.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
    function metaTotal(m){ return soma(metas.filter(function(x){ return x.mes === m; }), 'valor'); }
    function realTotal(m){ return soma(fin.filter(function(f){ return f.tipo === 'receita' && String(f.data).slice(0,7) === m; }), 'valor'); }
    var mAtual = realTotal(metasMes), mMeta = metaTotal(metasMes);
    var mesAnt = meses[meses.indexOf(metasMes) - 1] || null;
    var cresc = mesAnt && realTotal(mesAnt) > 0 ? ((realTotal(metasMes) / realTotal(mesAnt)) - 1) * 100 : null;
    var h = '<div class="page-head"><div><h1>Metas e crescimento</h1><div class="ph-sub">defina, edite e acompanhe a evolução mês a mês</div></div>';
    h += '<div class="ph-actions"><input type="month" class="mini-input" id="metas-mes" value="' + metasMes + '"><button class="btn btn-p" id="btn-defmetas">Editar metas do mês</button></div></div>';
    h += '<div class="grid g3">';
    h += '<div class="kpi"><div class="k-label">Receita de ' + fmtD(metasMes + '-01').slice(3) + '</div><div class="k-value">' + brlS(mAtual) + '</div><div class="k-foot">meta <b>' + (mMeta ? brlS(mMeta) : 'não definida') + '</b></div></div>';
    h += '<div class="kpi ' + (mMeta && mAtual >= mMeta ? 'k-green' : '') + '"><div class="k-label">Atingimento</div><div class="k-value">' + (mMeta ? Math.round(mAtual / mMeta * 100) + '%' : '--') + '</div><div class="k-foot">da meta do mês selecionado</div></div>';
    h += '<div class="kpi ' + (cresc == null ? '' : cresc >= 0 ? 'k-green' : 'k-red') + '"><div class="k-label">Crescimento vs mês anterior</div><div class="k-value">' + (cresc == null ? '--' : (cresc >= 0 ? '+' : '') + cresc.toFixed(1).replace('.', ',') + '%') + '</div><div class="k-foot">receita realizada</div></div></div>';
    h += '<div class="card-p" style="margin-top:13px"><div class="p-head"><div><div class="p-title">Meta x realizado, últimos 12 meses</div><div class="p-tag">É assim que se mede o crescimento</div></div></div><div class="chart-box" style="height:210px"><canvas id="ch-metas"></canvas></div></div>';
    h += '<div class="card-p" style="margin-top:13px"><div class="p-head"><div class="p-title">Histórico mensal</div></div><div style="overflow-x:auto"><table class="tbl"><tr><th>Mês</th><th style="text-align:right">Meta</th><th style="text-align:right">Realizado</th><th style="text-align:right">Atingimento</th><th style="text-align:right">Crescimento</th><th></th></tr>';
    for (var j = meses.length - 1; j >= 0; j--) {
      var m = meses[j], mt = metaTotal(m), rl = realTotal(m);
      var ant = j > 0 ? realTotal(meses[j-1]) : 0;
      var cr = ant > 0 ? ((rl / ant) - 1) * 100 : null;
      var pct = mt > 0 ? Math.round(rl / mt * 100) : null;
      h += '<tr><td style="font-weight:700">' + fmtD(m + '-01').slice(3) + '</td><td style="text-align:right;color:var(--ink-muted)">' + (mt ? brl(mt) : '') + '</td><td style="text-align:right;font-weight:700">' + brl(rl) + '</td>' +
        '<td style="text-align:right">' + (pct == null ? '' : '<span class="chip ' + (pct >= 100 ? 'c-green' : pct >= 70 ? 'c-amber' : 'c-red') + '">' + pct + '%</span>') + '</td>' +
        '<td style="text-align:right;font-weight:700;color:' + (cr == null ? 'var(--ink-muted)' : cr >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (cr == null ? '' : (cr >= 0 ? '+' : '') + cr.toFixed(1).replace('.', ',') + '%') + '</td>' +
        '<td style="width:60px"><button class="btn btn-o btn-sm" data-em="' + m + '">Metas</button></td></tr>';
    }
    h += '</table></div></div>';
    $('view').innerHTML = h;

    charts.metas = new Chart($('ch-metas'), { data: { labels: meses.map(function(m){ var p = m.split('-'); return p[1] + '/' + p[0].slice(2); }), datasets: [
      { type: 'bar', label: 'Realizado', data: meses.map(realTotal), backgroundColor: '#025291', borderRadius: 4 },
      { type: 'line', label: 'Meta', data: meses.map(function(m){ return metaTotal(m) || null; }), borderColor: '#fcc740', backgroundColor: '#fcc740', borderWidth: 2.5, tension: .2, pointRadius: 3 }
    ]}, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { family: 'Manrope', size: 10 }, boxWidth: 11 } }, tooltip: { callbacks: { label: function(c){ return c.dataset.label + ': ' + brl(c.parsed.y); } } } },
      scales: { x: { grid: { display: false }, ticks: { font: { family: 'Manrope', size: 9 } } }, y: { ticks: { font: { family: 'Manrope', size: 9 }, callback: function(v){ return brlS(v); } }, grid: { color: '#f3e3d0' } } } } });

    function editarMetas(m){
      var init = {};
      CAT_REC_BASE.slice(0,3).forEach(function(c){ var x = metas.find(function(y){ return y.mes === m && y.categoria === c; }); init[c] = x ? x.valor : ''; });
      openForm('Metas de ' + fmtD(m + '-01').slice(3), CAT_REC_BASE.slice(0,3).map(function(c){ return { k: c, label: 'Meta ' + c + ' (R$)', type: 'number' }; }), init, async function(out){
        for (var c of CAT_REC_BASE.slice(0,3)) {
          var ex = metas.find(function(y){ return y.mes === m && y.categoria === c; });
          if (ex) await DB.update('rg_metas', ex.id, { valor: out[c] || 0 });
          else if (out[c]) await DB.insert('rg_metas', { mes: m, categoria: c, valor: out[c] });
        }
        closeModal(); go('metas');
      });
    }
    $('metas-mes').onchange = function(){ metasMes = this.value || mesAtual(); go('metas'); };
    $('btn-defmetas').onclick = function(){ editarMetas(metasMes); };

    html += '<div class="f-row" id="doc-row-url"><label>Endereço do link</label><input id="doc-url" placeholder="https://..."></div>';

    html += '<div style="font-size:10px;color:var(--ink-muted);line-height:1.6">Arquivo grande? Suba no Drive e anexe o link.</div>';
    html += '<div class="m-actions"><button class="btn btn-o" id="m-cancel">Cancelar</button><button class="btn btn-p" id="m-save">Salvar</button></div>';
    $('modal').innerHTML = html;
    $('modal-bg').classList.add('show');
    modalDirty = false;
    $('modal').querySelectorAll('input,select').forEach(function(el){ el.addEventListener('input', function(){ modalDirty = true; }); });
    $('doc-tipo').onchange = function(){
      var link = this.value === 'link';
      $('doc-row-url').style.display = link ? '' : 'none';
      $('doc-row-file').style.display = link ? 'none' : '';
    };
    $('m-cancel').onclick = tryCloseModal;
    modalSave = async function(){
      var row = { nome: $('doc-nome').value.trim(), criado_em: new Date().toISOString() };
      if (cfg.contexto === 'projeto') row.projeto_id = parseInt($('doc-ref').value, 10);
      if (cfg.cliente_id) row.cliente_id = cfg.cliente_id;
      if (cfg.curso_id) row.curso_id = cfg.curso_id;
      if ($('doc-tipo').value === 'link') {
        var url = $('doc-url').value.trim();
        if (!url) return alert('Cole o endereço do link.');
        if (!/^https?:\/\//.test(url)) url = 'https://' + url;
        row.tipo = 'link'; row.url = url; row.nome = row.nome || url;
        await DB.insert('rg_documentos', row); closeModal(); cfg.aoSalvar();
      } else {
        var f = $('doc-file').files && $('doc-file').files[0];
        if (!f) return alert('Escolha um arquivo.');
        if (f.size > 1572864) return alert('Arquivo grande demais (máx 1,5 MB). Suba no Drive e anexe o link.');
        var rd = new FileReader();
        rd.onload = async function(){ row.tipo = 'arquivo'; row.url = rd.result; row.nome = row.nome || f.name; await DB.insert('rg_documentos', row); closeModal(); cfg.aoSalvar(); };
        rd.readAsDataURL(f);
      }
    };
    $('m-save').onclick = function(){ modalSave(); };
    $('doc-nome').focus();
  }

  /* ================= AGENDA + GOOGLE CALENDAR ================= */
  var gToken = null, agMes = null;
  function googleReady(){ return cfg.GOOGLE_CLIENT_ID && window.google && google.accounts && google.accounts.oauth2; }
  function connectGoogle(cb){
    if (!googleReady()) { alert('Google Agenda ainda não configurado. Veja o passo do Google no LEIA-ME e preencha GOOGLE_CLIENT_ID no config.js.'); return; }
    var tc = google.accounts.oauth2.initTokenClient({
      client_id: cfg.GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.events',
      callback: function(resp){ if (resp.access_token) { gToken = resp.access_token; if (cb) cb(); } }
    });
    tc.requestAccessToken();
  }
  async function listGoogle(){
    if (!gToken) return [];
    var tmin = new Date().toISOString();
    var tmax = new Date(Date.now() + 30 * 864e5).toISOString();
    try {
      var r = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&timeMin=' + encodeURIComponent(tmin) + '&timeMax=' + encodeURIComponent(tmax) + '&maxResults=50', { headers: { Authorization: 'Bearer ' + gToken } });
      if (!r.ok) { if (r.status === 401) gToken = null; return []; }
      var j = await r.json();
      return (j.items || []).map(function(ev){
        var st = ev.start || {};
        return { data: (st.dateTime || st.date || '').slice(0,10), hora: st.dateTime ? st.dateTime.slice(11,16) : '', titulo: ev.summary || '(sem título)', google: true };
      });
    } catch(e){ return []; }
  }
  async function createGoogle(titulo, dataISO, hora){
    if (!gToken) return;
    var body;
    if (hora) {
      var ini = dataISO + 'T' + hora + ':00';
      var fimD = new Date(dataISO + 'T' + hora + ':00'); fimD.setHours(fimD.getHours() + 1);
      var fim = fimD.getFullYear() + '-' + String(fimD.getMonth()+1).padStart(2,'0') + '-' + String(fimD.getDate()).padStart(2,'0') + 'T' + String(fimD.getHours()).padStart(2,'0') + ':' + String(fimD.getMinutes()).padStart(2,'0') + ':00';
      body = { summary: titulo, start: { dateTime: ini, timeZone: 'America/Recife' }, end: { dateTime: fim, timeZone: 'America/Recife' } };
    } else {
      body = { summary: titulo, start: { date: dataISO }, end: { date: dataISO } };
    }
    try {
      await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', { method: 'POST', headers: { Authorization: 'Bearer ' + gToken, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch(e){ console.error(e); }
  }

  function cliSerie(id){
    var cmv = lsCli(id, 'dose-cmv-periodos') || [];
    var inds = lsCli(id, 'dose-indicadores') || [];
    var map = {};
    cmv.forEach(function(p){
      var ym = parsePeriodoNome(p.periodo); if (!ym) return;
      var o = map[ym] = map[ym] || { ym: ym };
      var fat = parseFloat(p.fat) || 0;
      if (fat) { o.fat = fat; o.cmvPct = (parseFloat(p.insumos) || 0) / fat * 100; }
    });
    inds.forEach(function(p){
      var ym = parsePeriodoNome(p.periodo); if (!ym) return;
      var o = map[ym] = map[ym] || { ym: ym };
      if (p.fat != null) o.fat = parseFloat(p.fat);
      if (p.cmv != null) o.cmvPct = parseFloat(p.cmv);
      if (p.resultado != null) o.resultado = parseFloat(p.resultado);
      if (p.ticket != null) o.ticket = parseFloat(p.ticket);
    });
    return Object.keys(map).sort().map(function(k){ return map[k]; });
  }

          (v.obs ? '<div style="font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin-bottom:4px">Observações</div><div style="font-size:12px;white-space:pre-wrap;margin-bottom:10px">' + esc(v.obs) + '</div>' : '') +

  /* dashboard dinamico do cliente, lendo o D.O.S.E. */
  function renderCliDash(id){
    var el = $('cli-dash');
    if (!el) return;
    var cmv = lsCli(id, 'dose-cmv-periodos') || [];
    var inds = lsCli(id, 'dose-indicadores') || [];
    var map = {};
    cmv.forEach(function(p){
      var ym = parsePeriodoNome(p.periodo); if (!ym) return;
      var o = map[ym] = map[ym] || { ym: ym };
      var fat = parseFloat(p.fat) || 0;
      if (fat) { o.fat = fat; o.cmvPct = (parseFloat(p.insumos) || 0) / fat * 100; }
    });
    inds.forEach(function(p){
      var ym = parsePeriodoNome(p.periodo); if (!ym) return;
      var o = map[ym] = map[ym] || { ym: ym };
      if (p.fat != null) o.fat = parseFloat(p.fat);
      if (p.cmv != null) o.cmvPct = parseFloat(p.cmv);
      if (p.resultado != null) o.resultado = parseFloat(p.resultado);
      if (p.ticket != null) o.ticket = parseFloat(p.ticket);
    });
    var serie = Object.keys(map).sort().map(function(k){ return map[k]; });
    var ult = serie[serie.length - 1] || null;
    var fichas = lsCli(id, 'dose-fichas') || [], ings = lsCli(id, 'dose-ingredientes') || [], est = lsCli(id, 'dose-estoque-itens') || [];
    var preenchidas = DOSE_DATA_KEYS.filter(function(k){ return temDado(lsCli(id, k[1])); });

    if (!ult && !preenchidas.length) {
      el.innerHTML = '<div class="empty">Os números do restaurante aparecem aqui sozinhos conforme as ferramentas D.O.S.E. forem preenchidas. Comece pelo S2 (CMV) ou E4 (Indicadores).</div>';
      return;
    }
    function mesLabel(ym){ if (!ym) return ''; var p = ym.split('-'); return p[1] + '/' + p[0].slice(2); }
    function cmvClass(v){ return v == null ? '' : v <= 35 ? 'k-green' : v <= 42 ? '' : 'k-red'; }
    var h = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">';
    h += '<div class="kpi k-blue"><div class="k-label">Faturamento</div><div class="k-value">' + (ult && ult.fat ? brlS(ult.fat) : '--') + '</div><div class="k-foot">último mês registrado' + (ult ? ' <b>' + mesLabel(ult.ym) + '</b>' : '') + '</div></div>';
    h += '<div class="kpi ' + cmvClass(ult && ult.cmvPct) + '"><div class="k-label">CMV</div><div class="k-value">' + (ult && ult.cmvPct != null ? ult.cmvPct.toFixed(1).replace('.', ',') + '%' : '--') + '</div><div class="k-foot">' + (ult && ult.cmvPct != null ? (ult.cmvPct <= 35 ? 'dentro do saudável' : ult.cmvPct <= 42 ? 'atenção, acima do ideal' : 'crítico, agir agora') : 'preencha o S2 ou E4') + '</div></div>';
    h += '<div class="kpi ' + (ult && ult.resultado != null ? (ult.resultado >= 0 ? 'k-green' : 'k-red') : '') + '"><div class="k-label">Resultado</div><div class="k-value">' + (ult && ult.resultado != null ? brlS(ult.resultado) : '--') + '</div><div class="k-foot">do último mês registrado</div></div>';
    h += '<div class="kpi k-purple"><div class="k-label">Ticket médio</div><div class="k-value">' + (ult && ult.ticket != null ? brl(ult.ticket) : '--') + '</div><div class="k-foot">painel de indicadores E4</div></div>';
    h += '</div>';
    h += '<div class="grid g21" style="margin-top:13px">';
    h += '<div class="chart-box" style="height:205px"><canvas id="ch-cli"></canvas></div>';
    h += '<div><div style="font-size:11px;font-weight:800;margin-bottom:7px">Cobertura do método</div>';
    h += '<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px"><div class="bar-wrap" style="flex:1"><div class="bar-fill" style="width:' + Math.round(preenchidas.length / DOSE_DATA_KEYS.length * 100) + '%"></div></div><span style="font-size:10.5px;color:var(--ink-muted);font-weight:700">' + preenchidas.length + ' de ' + DOSE_DATA_KEYS.length + '</span></div>';
    h += '<div style="font-size:11px;color:var(--ink-soft);line-height:2.1">';
    h += '<b>' + fichas.length + '</b> fichas técnicas cadastradas<br><b>' + ings.length + '</b> ingredientes no banco<br><b>' + est.length + '</b> itens no controle de estoque</div></div>';
    h += '</div>';
    el.innerHTML = h;

    if (serie.length) {
      var comFat = serie.filter(function(x){ return x.fat; });
      charts.cli = new Chart($('ch-cli'), { data: { labels: serie.map(function(x){ return mesLabel(x.ym); }), datasets: [
        { type: 'bar', label: 'Faturamento', data: serie.map(function(x){ return x.fat || null; }), backgroundColor: '#025291', borderRadius: 5, yAxisID: 'y' },
        { type: 'line', label: 'CMV %', data: serie.map(function(x){ return x.cmvPct != null ? +x.cmvPct.toFixed(1) : null; }), borderColor: '#f25c54', backgroundColor: '#f25c54', tension: .3, pointRadius: 3, borderWidth: 2, yAxisID: 'y1' }
      ]}, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { font: { family: 'Manrope', size: 10 }, boxWidth: 11 } }, tooltip: { callbacks: { label: function(c){ return c.dataset.label + ': ' + (c.dataset.yAxisID === 'y1' ? c.parsed.y + '%' : brl(c.parsed.y)); } } } },
        scales: { x: { grid: { display: false }, ticks: { font: { family: 'Manrope', size: 9 } } },
          y: { ticks: { font: { family: 'Manrope', size: 9 }, callback: function(v){ return brlS(v); } }, grid: { color: '#f3e3d0' } },
          y1: { position: 'right', ticks: { font: { family: 'Manrope', size: 9 }, callback: function(v){ return v + '%'; } }, grid: { display: false }, suggestedMin: 0, suggestedMax: 60 } } } });
    }
  }

  /* plano de acao generico (cliente ou mentorado) */
  function renderPlano(elId, itens, refCol, reload){
    var el = $(elId);
    el.innerHTML = itens.length ? '<table class="tbl">' + itens.map(function(p){
      var next = p.status === 'aberto' ? 'fazendo' : p.status === 'fazendo' ? 'feito' : 'aberto';
      var cor = p.status === 'feito' ? 'c-green' : p.status === 'fazendo' ? 'c-blue' : 'c-gray';
      return '<tr><td style="width:80px"><button class="btn btn-o btn-sm" data-pst="' + p.id + ':' + next + '"><span class="chip ' + cor + '" style="padding:1px 7px">' + p.status + '</span></button></td><td' + (p.status === 'feito' ? ' style="text-decoration:line-through;color:var(--ink-muted)"' : '') + '>' + esc(p.item) + '</td><td style="width:76px;color:var(--ink-muted)">' + (p.prazo ? fmtDcurta(p.prazo) : '') + '</td><td style="width:30px"><button class="icon-btn" data-pdel="' + p.id + '">&#10005;</button></td></tr>';
    }).join('') + '</table>' : '<div class="empty">Plano de ação vazio. Adicione o primeiro item.</div>';
    el.querySelectorAll('[data-pst]').forEach(function(b){
      b.onclick = async function(){ var p = b.getAttribute('data-pst').split(':'); await DB.update('rg_plano_itens', p[0], { status: p[1] }); reload(); };
    });
    el.querySelectorAll('[data-pdel]').forEach(function(b){
      b.onclick = async function(){ await DB.remove('rg_plano_itens', b.getAttribute('data-pdel')); reload(); };
    });
    var addBtn = elId === 'plano-body' ? $('btn-pl') : $('btn-plm');
    if (addBtn) addBtn.onclick = function(){
      openForm('Novo item do plano de ação', [
        { k:'item', label:'O que precisa ser feito' },
        { k:'prazo', label:'Prazo', type:'date' }
      ], null, async function(out){
        Object.assign(out, refCol); out.status = 'aberto';
        await DB.insert('rg_plano_itens', out); closeModal(); reload();
      });
    };
  }

  VIEWS.mentorados = async function(){
    var res = await Promise.all([DB.list('rg_mentorados'), DB.list('rg_sessoes')]);
    var mentorados = res[0], sessoes = res[1];
    var hoje = hojeISO();
    var h = '<div class="page-head"><h1>Mentorados</h1><div class="ph-sub">' + mentorados.filter(function(m){ return m.status === 'ativo'; }).length + ' ativos</div>';
    h += '<div class="ph-actions"><button class="btn btn-p" id="btn-men">+ Novo mentorado</button></div></div>';
    h += mentorados.length ? '<div class="card-p"><table class="tbl"><tr><th>Mentorado</th><th>Produto</th><th>Sessões</th><th>Próxima sessão</th><th>Status</th></tr>' + mentorados.map(function(m){
      var sm = sessoes.filter(function(s){ return String(s.mentorado_id) === String(m.id); });
      var feitas = sm.filter(function(s){ return s.status === 'realizada'; }).length;
      var prox = sm.filter(function(s){ return s.status === 'agendada' && s.data >= hoje; }).sort(function(a,b){ return String(a.data).localeCompare(String(b.data)); })[0];
      return '<tr class="rowlink" data-men="' + m.id + '"><td style="font-weight:600">' + esc(m.nome) + '</td><td>' + esc(m.produto || '') + '</td><td style="text-align:center;font-weight:700">' + feitas + (m.encontros_total ? '<span style="color:var(--ink-muted);font-weight:500"> de ' + m.encontros_total + '</span>' : '') + '</td><td style="color:' + (prox ? 'var(--ink)' : 'var(--ink-muted)') + '">' + (prox ? fmtD(prox.data) + (prox.hora ? ' às ' + prox.hora : '') : 'não agendada') + '</td><td><span class="chip ' + (m.status === 'ativo' ? 'c-green' : 'c-gray') + '">' + m.status + '</span></td></tr>';
    }).join('') + '</table></div>' : '<div class="card-p"><div class="empty">Nenhum mentorado ainda.</div></div>';
    $('view').innerHTML = h;
    $('btn-men').onclick = function(){ formMentorado(null, function(){ go('mentorados'); }); };
    $('view').querySelectorAll('[data-men]').forEach(function(el){ el.onclick = function(){ go('mentorado', el.getAttribute('data-men')); }; });
  };
  function formMentorado(data, done){
    openForm(data ? 'Editar mentorado' : 'Novo mentorado', [
      { k:'nome', label:'Nome' },
      { k:'contato', label:'Contato' },
      { k:'produto', label:'Mentoria', type:'select', options:['A Bússola','Ao Ponto','Mentoria individual'], half:true, custom: true },
      { k:'encontros_total', label:'Quantos encontros são?', type:'number', half:true },
      { k:'inicio', label:'Início', type:'date', def: hojeISO(), half:true },
      { k:'status', label:'Status', type:'select', options:['ativo','concluido','pausado'] },

    ], data, async function(out){
      if (data) await DB.update('rg_mentorados', data.id, out); else await DB.insert('rg_mentorados', out);
      closeModal(); done();

  /* ================= VENDAS E BASE DE ALUNOS (import Hotmart) ================= */
  function parseCSVTexto(txt){
    txt = String(txt).replace(/^﻿/, '');
    var delim = (txt.split(';').length > txt.split(',').length) ? ';' : ',';
    var rows = [], row = [], cur = '', dentro = false;
    for (var i = 0; i < txt.length; i++) {
      var ch = txt[i];
      if (dentro) {
        if (ch === '"') { if (txt[i+1] === '"') { cur += '"'; i++; } else dentro = false; }
        else cur += ch;
      } else {
        if (ch === '"') dentro = true;
        else if (ch === delim) { row.push(cur); cur = ''; }
        else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i+1] === '\n') i++; row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
        else cur += ch;
      }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function numBR(v){
    v = String(v == null ? '' : v).trim();
    if (!v) return 0;
    if (v.indexOf(',') > -1 && v.indexOf('.') > -1) v = v.replace(/\./g, '').replace(',', '.');
    else v = v.replace(',', '.');
    return parseFloat(v) || 0;
  }
  function dataBR(v){
    var m = String(v || '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
  }
  var LOTES_POR_ID = {};
  function vendaVisivel(v){
    if (v.excluido) return false;
    if (v.lote_id == null) return true;
    var lote = LOTES_POR_ID[v.lote_id];
    if (!lote) return false;

        var loteRes = await criarLote({

    return '<div class="kb-mini">' + linhas.map(function(l){
      var p = l.split(':');
      var nome = p.shift().trim();
      var cards = p.join(':').split(';').map(function(cx){ return cx.trim(); }).filter(Boolean);
      return '<div class="kb-mini-col"><div class="kb-mini-head">' + esc(nome) + '<span>' + cards.length + '</span></div>' + cards.map(function(cx){ return '<div class="kb-mini-card">' + esc(cx) + '</div>'; }).join('') + '</div>';
    }).join('') + '</div>';
  }
  /* quadro visual: nós arrastáveis com conexões (estilo Whimsical/Miro simplificado) */
  function montarQuadro(container, bloco){
    var dados;
    try { dados = JSON.parse(bloco.v || 'null') || {}; } catch(e){ dados = {}; }
    dados.nodes = dados.nodes || []; dados.edges = dados.edges || [];
    var ligando = null;
    container.innerHTML = '<div class="qd-bar"><button type="button" class="btn btn-o btn-sm" data-q-add="etapa">+ Etapa</button><button type="button" class="btn btn-o btn-sm" data-q-add="decisao">+ Decisão</button><button type="button" class="btn btn-o btn-sm" data-q-add="fim">+ Início / Fim</button><button type="button" class="btn btn-o btn-sm" id="q-ligar-' + Math.random().toString(36).slice(2,7) + '" data-q-ligar>&#8594; Ligar</button><span class="qd-dica">arraste os blocos · dois cliques renomeia · Ligar conecta dois blocos · clique no meio de uma seta pra removê-la</span></div><div class="qd-canvas"><svg class="qd-svg"></svg></div>';
    var canvas = container.querySelector('.qd-canvas');
    var svg = container.querySelector('.qd-svg');
    function salvarQ(){ bloco.v = JSON.stringify(dados); }
    function desenhar(){
      canvas.querySelectorAll('.qd-no').forEach(function(n){ n.remove(); });
      dados.nodes.forEach(function(n){
        var el = document.createElement('div');
        el.className = 'qd-no qd-' + (n.tp || 'etapa') + (ligando === n.id ? ' qd-lig' : '');
        el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
        el.setAttribute('data-qid', n.id);
        el.innerHTML = '<span>' + esc(n.t) + '</span><button type="button" class="qd-x">&#10005;</button>';
        canvas.appendChild(el);
      });
      linhas();
      ligar();
    }
    function linhas(){
      var W = Math.max(canvas.scrollWidth, canvas.clientWidth), H = Math.max(canvas.scrollHeight, canvas.clientHeight);
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.style.width = W + 'px'; svg.style.height = H + 'px';
      svg.innerHTML = '<defs><marker id="qseta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#025291"/></marker></defs>' + dados.edges.map(function(e, i){
        var a = dados.nodes.find(function(n){ return n.id === e[0]; });
        var b = dados.nodes.find(function(n){ return n.id === e[1]; });
        if (!a || !b) return '';
        var ea = canvas.querySelector('[data-qid="' + a.id + '"]'), eb = canvas.querySelector('[data-qid="' + b.id + '"]');
        var aw = ea ? ea.offsetWidth : 120, ah = ea ? ea.offsetHeight : 38, bw = eb ? eb.offsetWidth : 120, bh = eb ? eb.offsetHeight : 38;
        var x1 = a.x + aw / 2, y1 = a.y + ah / 2, x2 = b.x + bw / 2, y2 = b.y + bh / 2;
        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#025291" stroke-width="2" marker-end="url(#qseta)"/><circle data-qe="' + i + '" cx="' + mx + '" cy="' + my + '" r="7" fill="#cb2f41" opacity="0.75" style="cursor:pointer"/><text x="' + mx + '" y="' + (my + 3) + '" text-anchor="middle" font-size="9" fill="#fff" style="pointer-events:none">&#10005;</text>';
      }).join('');
      svg.querySelectorAll('[data-qe]').forEach(function(cq){
        cq.addEventListener('click', function(){ dados.edges.splice(parseInt(cq.getAttribute('data-qe'), 10), 1); salvarQ(); desenhar(); });
      });
    }
    function ligar(){
      canvas.querySelectorAll('.qd-no').forEach(function(el){
        var id = el.getAttribute('data-qid');
        var n = dados.nodes.find(function(x){ return x.id === id; });
        el.querySelector('.qd-x').addEventListener('click', function(ev){
          ev.stopPropagation();
          dados.nodes = dados.nodes.filter(function(x){ return x.id !== id; });
          dados.edges = dados.edges.filter(function(e){ return e[0] !== id && e[1] !== id; });
          salvarQ(); desenhar();
        });
        el.addEventListener('dblclick', function(){
          var t = prompt('Texto do bloco:', n.t);
          if (t != null) { n.t = t.trim() || n.t; salvarQ(); desenhar(); }
        });
        el.addEventListener('pointerdown', function(ev){
          if (ev.target.classList.contains('qd-x')) return;
          if (container.dataset.ligando === '1') {
            if (!ligando) { ligando = id; desenhar(); }
            else if (ligando !== id) {
              if (!dados.edges.some(function(e){ return e[0] === ligando && e[1] === id; })) dados.edges.push([ligando, id]);
              ligando = null; container.dataset.ligando = ''; container.querySelector('[data-q-ligar]').classList.remove('btn-p');
              salvarQ(); desenhar();
            }
            return;
          }
          ev.preventDefault();
          var sx = ev.clientX, sy = ev.clientY, ox = n.x, oy = n.y;
          function mv(e2){ n.x = Math.max(0, ox + e2.clientX - sx); n.y = Math.max(0, oy + e2.clientY - sy); el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; linhas(); }
          function up(){ document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); salvarQ(); }
          document.addEventListener('pointermove', mv);
          document.addEventListener('pointerup', up);
        });
      });
    }
    container.querySelectorAll('[data-q-add]').forEach(function(b){
      b.addEventListener('click', function(){
        var tp = b.getAttribute('data-q-add');
        var t = prompt(tp === 'decisao' ? 'Pergunta da decisão:' : 'Texto do bloco:', '');
        if (t == null || !t.trim()) return;
        dados.nodes.push({ id: 'n' + Date.now() + Math.floor(Math.random() * 999), t: t.trim(), tp: tp, x: 24 + (dados.nodes.length % 4) * 150, y: 24 + Math.floor(dados.nodes.length / 4) * 90 });
        salvarQ(); desenhar();
      });
    });
    container.querySelector('[data-q-ligar]').addEventListener('click', function(){
      var on = container.dataset.ligando === '1';
      container.dataset.ligando = on ? '' : '1';
      ligando = null;
      this.classList.toggle('btn-p', !on);
      desenhar();
    });
    desenhar();
  }

  VIEWS.processo = async function(id){
    var procs = await DB.list('rg_processos');
    var p = byId(procs, id);
    if (!p) return go('proc');
    var blocos = parseBlocos(p);
    $('tb-title').textContent = p.nome;
    var h = '<div class="page-head"><div><h1 style="font-size:19px">' + esc(p.nome) + '</h1><div class="ph-sub"><span class="chip ' + (AREA_CORES[p.area] || 'c-gray') + '">' + esc(p.area || 'Geral') + '</span></div></div>';
    h += '<div class="ph-actions"><button class="btn btn-o btn-sm" id="pr-edit">Renomear</button><button class="btn btn-o btn-sm" id="pr-back">&larr; Todos os processos</button><button class="btn btn-p" id="pr-save">Salvar processo</button></div></div>';
    h += '<div id="blocos-wrap"></div>';
    h += '<div class="card-p" style="text-align:center"><div style="font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin-bottom:10px">Adicionar conteúdo</div>';
    h += '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">';
    h += '<button class="btn btn-o" data-add="quadro">+ Quadro visual</button><button class="btn btn-o" data-add="fluxo">+ Fluxo</button><button class="btn btn-o" data-add="kanban">+ Kanban</button><button class="btn btn-o" data-add="mapa">+ Mapa mental</button><button class="btn btn-o" data-add="texto">+ Texto</button><button class="btn btn-o" data-add="img">+ Imagem</button>';
    h += '</div></div>';
    $('view').innerHTML = h;

    function renderBlocos(){
      $('blocos-wrap').innerHTML = blocos.map(function(b, i){
        var acts = '<div class="bl-acts">' +
          (i > 0 ? '<button class="icon-btn" data-up="' + i + '" title="Subir">&uarr;</button>' : '') +
          (i < blocos.length - 1 ? '<button class="icon-btn" data-dn="' + i + '" title="Descer">&darr;</button>' : '') +
          '<button class="icon-btn" data-rm="' + i + '" title="Remover">&#10005;</button></div>';
        var body = '';
        if (b.t === 'texto') body = '<textarea data-tx="' + i + '" placeholder="Descreva o processo, regras, combinados...">' + esc(b.v || '') + '</textarea>';
        if (b.t === 'fluxo') body = '<textarea data-tx="' + i + '" placeholder="Uma etapa por linha. Comece com ? pra decisão.">' + esc(b.v || '') + '</textarea><div data-prev="' + i + '">' + fluxoPreviewHTML(b.v) + '</div>';
        if (b.t === 'mapa') body = '<textarea data-tx="' + i + '" placeholder="Centro na primeira linha, ramos com -">' + esc(b.v || '') + '</textarea><div data-prev="' + i + '">' + mapaPreviewHTML(b.v) + '</div>';
        if (b.t === 'img') body = '<input type="file" accept="image/*" data-file="' + i + '" style="font-family:Manrope;font-size:11px">' + (b.v ? '<img class="bl-img" src="' + b.v + '">' : '<div class="empty" style="padding:10px">Escolha uma imagem (até 1,5 MB). Fica salva junto com o processo.</div>');
        if (b.t === 'kanban') body = '<textarea data-tx="' + i + '" placeholder="Uma coluna por linha: Nome da coluna: cartão; cartão; cartão">' + esc(b.v || '') + '</textarea><div data-prev="' + i + '">' + kanbanPreviewHTML(b.v) + '</div>';
        if (b.t === 'quadro') body = '<div data-quadro="' + i + '"></div>';
        return '<div class="bloco"><div class="bl-head">' + TIPO_BLOCO[b.t] + acts + '</div><div class="bl-body">' + body + '</div></div>';
      }).join('') || '<div class="card-p"><div class="empty">Monte este processo com os blocos aí embaixo. Dá pra combinar fluxo + texto + mapa mental + imagem no mesmo processo.</div></div>';

      $('blocos-wrap').querySelectorAll('[data-tx]').forEach(function(t){
        t.addEventListener('input', function(){
          var i = parseInt(t.getAttribute('data-tx'), 10);
          blocos[i].v = t.value;
          var prev = $('blocos-wrap').querySelector('[data-prev="' + i + '"]');
          if (prev) prev.innerHTML = blocos[i].t === 'fluxo' ? fluxoPreviewHTML(t.value) : blocos[i].t === 'kanban' ? kanbanPreviewHTML(t.value) : mapaPreviewHTML(t.value);
        });
      });
      $('blocos-wrap').querySelectorAll('[data-quadro]').forEach(function(el){
        montarQuadro(el, blocos[parseInt(el.getAttribute('data-quadro'), 10)]);
      });
      $('blocos-wrap').querySelectorAll('[data-file]').forEach(function(inp){
        inp.addEventListener('change', function(){
          var f = inp.files && inp.files[0];
          if (!f) return;
          if (f.size > 1572864) { alert('Imagem grande demais (máx 1,5 MB). Reduza e tente de novo.'); inp.value = ''; return; }
          var rd = new FileReader();
          rd.onload = function(){ blocos[parseInt(inp.getAttribute('data-file'), 10)].v = rd.result; renderBlocos(); };
          rd.readAsDataURL(f);
        });
      });
      $('blocos-wrap').querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){ blocos.splice(parseInt(b.getAttribute('data-rm'), 10), 1); renderBlocos(); }; });
      $('blocos-wrap').querySelectorAll('[data-up]').forEach(function(b){ b.onclick = function(){ var i = parseInt(b.getAttribute('data-up'), 10); var x = blocos.splice(i, 1)[0]; blocos.splice(i - 1, 0, x); renderBlocos(); }; });
      $('blocos-wrap').querySelectorAll('[data-dn]').forEach(function(b){ b.onclick = function(){ var i = parseInt(b.getAttribute('data-dn'), 10); var x = blocos.splice(i, 1)[0]; blocos.splice(i + 1, 0, x); renderBlocos(); }; });
    }
    renderBlocos();

    $('view').querySelectorAll('[data-add]').forEach(function(b){
      b.onclick = function(){ blocos.push({ t: b.getAttribute('data-add'), v: '' }); renderBlocos(); };
    });
    $('pr-save').onclick = async function(){
      await DB.update('rg_processos', p.id, { nome: p.nome, area: p.area, blocos: JSON.stringify(blocos), atualizado: new Date().toISOString() });
      setSync('saved', DEMO ? 'Salvo neste navegador (demo)' : 'Salvo na nuvem');
      go('proc');
    };
    $('pr-back').onclick = function(){ go('proc'); };
    $('pr-edit').onclick = function(){
      openForm('Editar processo', [
        { k:'nome', label:'Nome do processo' },
        { k:'area', label:'Área', type:'select', options: AREAS_PROC },
        { k:'acesso', label:'Quem pode ver', type:'select', options: ACESSO_OPTS, def:'todos' },
        { k:'emails', label:'Emails (se pessoas específicas, separados por vírgula)' }
      ], p, async function(out){
        p.nome = out.nome; p.area = out.area; p.acesso = out.acesso; p.emails = out.emails;
        await DB.update('rg_processos', p.id, { nome: out.nome, area: out.area, acesso: out.acesso, emails: out.emails });
        closeModal(); go('processo', id);
      }, async function(){ await DB.remove('rg_processos', p.id); closeModal(); go('proc'); });
    };
  };
